nter-events:auto}.icon-btn svg{width:20px;height:20px}#server-list-wrap{padding:0 10px}#server-list{gap:14px}.server-row{padding:3px 4px;gap:6px}.server-name{font-size:15px}.server-status{font-size:11px}.server-row.status-fetching,.server-row.status-playing{padding:11px 12px;border-radius:10px}.server-row.status-fetching .server-name,.server-row.status-playing .server-name{font-size:16px}.progress-track{height:3px}#bar-footnote{font-size:11px;padding:0 14px 12px}#server-trigger{font-size:10px;padding:5px 10px;top:8px}}</style></head><body><div id="player-container"><div id="spinner"><div class="spin-ring"></div><span class="spin-label" id="spin-label">Loading…</span></div><media-player id="media-player-el" style="display:none" crossorigin playsinline log-level="warn" title="Video"><media-provider></media-provider><media-video-layout thumbnails=""></media-video-layout></media-player><div id="iframe-container"></div><div id="error-msg"></div><div id="control-bar"><div id="bar-top"><button id="tab-direct" class="mode-tab active" onclick='switchMode("direct")'>Direct<span class="chev">▾</span></button><button id="tab-embed" class="mode-tab" onclick='switchMode("embed")'>Servers<span class="chev">▾</span></button><button id="bar-collapse" onclick="hideBar()" title="Collapse">▲</button></div><div id="bar-icons"><button class="icon-btn" onclick="barBack()" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></button><button class="icon-btn" onclick="retryAllServers()" title="Retry servers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".6" fill="currentColor"/><circle cx="7" cy="17" r=".6" fill="currentColor"/></svg></button></div><span id="source-label"></span><div id="server-list-wrap"><div id="server-list"></div></div><div id="provider-row" style="display:none"></div><div id="bar-footnote"></div></div><button id="server-trigger" onclick="showBar(),renderServerList()" title="Choose a server">Servers ▾</button></div><script>

const VIDEOS_JSON_PATH = 'videos.json';

const EMBED_PROVIDERS = [
    { name: 'RiveStream',  movie: 'https://www.rivestream.ru/embed?type=movie&id=[ID]',  tv: 'https://www.rivestream.ru/embed?type=tv&id=[ID]&season=[S]&episode=[E]' },
];

const SLOW_MS   = 8000;
const AUTO_MS   = 0;

const OPENSUBTITLES_API_KEY_B64 = 'a2ZQY1hXN0dKbllPUVlZMFk5ak5FZklPT2szUmM1RWw=';
const OPENSUBTITLES_API_KEY   = atob(OPENSUBTITLES_API_KEY_B64);
const OPENSUBTITLES_PROXY_URL = '';           
const OPENSUBTITLES_LANGS     = 'si,en';      
const OPENSUBTITLES_DEFAULT_LANG = 'si'; 
const OPENSUBTITLES_MAX_PER_LANG = 2;
const _p   = new URLSearchParams(window.location.search);
const TMDB = _p.get('id')   || '';
const TYPE = _p.get('type') || 'movie';
const SN   = _p.get('s')    || '1';
const EP   = _p.get('e')    || '1';

let mode          = 'direct';  // 'direct' | 'embed'
let directSources = null;    
let directList    = [];        
let directStatus  = [];        
let directActiveIdx = -1;      
let provIdx       = 0;         
let slowTimer     = null;
let autoTimer     = null;
let mediaPlayer     = null;      

function spin(msg)  { document.getElementById('spin-label').textContent = msg || 'Loading…'; document.getElementById('spinner').classList.add('visible'); }
function unspin()   { document.getElementById('spinner').classList.remove('visible'); }

function setLabel(txt) { document.getElementById('source-label').textContent = txt; }

function showError(msg) {
    unspin();
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

function showBar()  {
    document.getElementById('control-bar').classList.add('visible');
    document.getElementById('server-trigger').classList.remove('visible');
}
function hideBar()  {
    document.getElementById('control-bar').classList.remove('visible');
    // Offer a way back in only once something is actually playing.
    if (mediaPlayer || document.getElementById('iframe-container').style.display === 'block') {
        document.getElementById('server-trigger').classList.add('visible');
    }
}

function barBack() {
    if (mode !== 'direct' && directSources) {
        switchMode('direct');
    }
    hideBar();
}

function retryAllServers() {
    embedStatus = embedStatus.map(() => 'idle');
    provIdx = 0;
    loadEmbed(0);
}

function setActiveTab(m) {
    document.getElementById('tab-direct').classList.toggle('active', m === 'direct');
    document.getElementById('tab-embed').classList.toggle('active',  m === 'embed');
    renderServerList();
}

// ── Server list (styled to match the reference "server select" screen) ────
let embedStatus = EMBED_PROVIDERS.map(() => 'idle'); // 'idle' | 'fetching' | 'error' | 'playing'

const FOOTNOTES = {
    direct: 'Playing from the direct library. Tap Servers if this source stalls or fails.',
    embed:  'If a server errors out, the next one in the list is tried automatically.'
};

function renderServerList() {
    const list = document.getElementById('server-list');
    const foot = document.getElementById('bar-footnote');
    list.innerHTML = '';
    foot.textContent = FOOTNOTES[mode] || '';

    if (mode === 'direct') {
        if (!directList.length) {
            const row = document.createElement('div');
            row.className = 'server-row status-error';
            row.innerHTML = `
                <div class="server-row-top">
                    <span class="server-name">Bioscope</span>
                    <span class="server-status">unavailable</span>
                </div>`;
            list.appendChild(row);
            return;
        }
        directList.forEach((item, i) => list.appendChild(
            buildServerRow(item.label, directStatus[i], () => playDirectSourceAt(i))
        ));
        return;
    }

    // embed mode
    EMBED_PROVIDERS.forEach((p, i) => list.appendChild(buildServerRow(p.name, embedStatus[i], () => loadEmbed(i))));
}

function buildServerRow(name, status, onClick) {
    const row = document.createElement('div');
    const cls = status === 'idle' ? 'available' : status;
    row.className = `server-row status-${cls}`;
    row.onclick = onClick;

    const statusLabel = { idle: 'available', fetching: 'fetching', error: 'error', playing: 'playing' }[status] || status;
    row.innerHTML = `
        <div class="server-row-top">
            <span class="server-name">${name}</span>
            <span class="server-status">${statusLabel}</span>
        </div>`;
    if (status === 'fetching' || status === 'playing') {
        row.innerHTML += `<div class="progress-track"><div class="progress-fill"></div></div>`;
    }
    return row;
}

// Legacy no-ops kept so any stray calls elsewhere don't break.
function renderProviderButtons() { renderServerList(); }

async function startDirect() {
    if (!TMDB) { showError('No content ID provided.'); return; }

    spin('Looking up your library…');

    const db = await fetchDB();
    if (!db) {
        
        unspin();
        autoFallbackToEmbed('Library unavailable');
        return;
    }

    const sources = TYPE === 'movie'
        ? db.movies?.[TMDB]
        : db.tv?.[TMDB]?.[SN]?.[EP];

    if (!sources || sources.length === 0) {
        unspin();
        autoFallbackToEmbed('Not in local library');
        return;
    }

    directSources = sources;
    unspin();
    playDirect(sources);
}

async function fetchDB() {
    try {
        const res = await fetch(VIDEOS_JSON_PATH);
        if (!res.ok) return null;
        return await res.json();
    } catch { return null; }
}

function playDirect(sources) {
    mode = 'direct';
    setActiveTab('direct');

    clearEmbed();

    const IFRAME_TYPES = ['dailymotion', 'google-drive',
                           'mega', 'vk', 'telegram', 'facebook', 'iframe'];
    const TYPE_LABELS = {
        mp4: 'Bioscope', hls: 'Bioscope', iframe: 'Bioscope',
        youtube: 'YouTube', vimeo: 'Vimeo', dailymotion: 'Dailymotion',
        'google-drive': 'Google Drive', mega: 'Mega', vk: 'VK',
        telegram: 'Telegram', facebook: 'Facebook'
    };

    directList = sources.map(s => {
        const type = s.type || detectType(s.src);
        const kind = IFRAME_TYPES.includes(type) ? 'iframe' : 'video';
        const base = TYPE_LABELS[type] || type;
        return { source: s, type, kind, base };
    });

    const counts = {};
    directList.forEach(item => { counts[item.base] = (counts[item.base] || 0) + 1; });
    const seenSoFar = {};
    directList.forEach(item => {
        seenSoFar[item.base] = (seenSoFar[item.base] || 0) + 1;
        item.label = counts[item.base] > 1 ? `${item.base} ${seenSoFar[item.base]}` : item.base;
    });

    directStatus    = directList.map(() => 'idle');
    directActiveIdx = -1;

    if (!directList.length) { autoFallbackToEmbed('No direct sources'); return; }
    playDirectSourceAt(0);
}

function playDirectSourceAt(idx) {
    if (idx >= directList.length) { autoFallbackToEmbed('All direct sources failed'); return; }

    directActiveIdx = idx;
    // Any other source still marked "playing"/"fetching" from before is no
    // longer active now that we're switching away from it — reset it so
    // the list doesn't keep showing every previously-played source as
    // "playing" forever.
    directStatus = directStatus.map((s, i) => i === idx ? 'fetching' : (s === 'playing' || s === 'fetching' ? 'idle' : s));
    renderServerList();

    const item = directList[idx];

    if (item.kind === 'iframe') {
        const url = buildDirectIframeUrl(item.source, item.type);
        if (!url) {
            directStatus[idx] = 'error';
            renderServerList();
            playDirectSourceAt(idx + 1);
            return;
        }
        renderDirectSourceIframe(url, idx);
    } else {
        renderDirectSourceNative(item.source, item.type, idx);
    }

    setLabel('Direct · ' + item.label);
    hideBar();
}

function renderDirectSourceIframe(url, idx) {
    document.getElementById('media-player-el').style.display = 'none';
    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = '';

    const wrapper = document.createElement('div');
    wrapper.className = 'iframe-wrapper';

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.className = 'ext-iframe';
    iframe.setAttribute('allow', 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    iframe.onload = () => {
        unspin();
        if (directActiveIdx === idx) {
            directStatus[idx] = 'playing';
            renderServerList();
        }
    };
    iframe.onerror = () => {
        directStatus[idx] = 'error';
        renderServerList();
        playDirectSourceAt(idx + 1);
    };
    wrapper.appendChild(iframe);
    container.appendChild(wrapper);
}

// Sinhala language codes that count as a match when deciding which track
// to mark as default.
const SINHALA_LANG_CODES = ['si', 'sin', 'si-lk'];

function isSinhala(lang) {
    return SINHALA_LANG_CODES.includes(String(lang || '').toLowerCase());
}

async function addSubtitleTracks(player, source) {
    const list = Array.isArray(source && source.subtitles) ? source.subtitles : [];
    if (list.length) {
        // Prioritize Sinhala as the default track whenever one is present,
        // regardless of whichever track the source data itself marked as
        // default.
        const hasSinhala = list.some(sub => isSinhala(sub.lang || sub.srclang));
        list.forEach((sub, i) => addOneSubtitleTrack(player, sub, i, hasSinhala));
        return;
    }
    // Live sources don't have OpenSubtitles-style entries, and the fetch
    // chain below is slow (sequential search + download requests). If the
    // player element gets disposed/reconfigured while it's still in flight,
    // calling player.textTracks.add() afterwards on a stale element can
    // throw deep inside Vidstack. Skip it outright for live sources.
    if (source && source.live) return;
    if (!OPENSUBTITLES_API_KEY && !OPENSUBTITLES_PROXY_URL) return;
    try {
        const fetched = await fetchOpenSubtitles(TMDB, TYPE, SN, EP);
        // The fetch above can take a while; if the user switched sources/
        // servers meanwhile, `player` may be a disposed/stale element.
        // Only attach tracks if it's still the one actually in use.
        if (player !== mediaPlayer) return;
        const hasSinhala = fetched.some(sub => isSinhala(sub.lang));
        fetched.forEach((sub, i) => addOneSubtitleTrack(player, sub, i, hasSinhala));
    } catch (err) {
        console.warn('[auto-server] OpenSubtitles fetch failed:', err);
    }
}

function addOneSubtitleTrack(player, sub, i, preferSinhala) {
    if (!sub || !sub.src) return;
    const lang = sub.lang || sub.srclang || 'en';
    // If a Sinhala track exists in this batch, it wins the default slot;
    // every other track in the batch is forced non-default so there's only
    // ever one default track.
    const isDefault = preferSinhala ? isSinhala(lang) : !!sub.default;
    player.textTracks.add({
        kind:     'subtitles',
        src:      sub.src,
        language: lang,
        label:    sub.label || sub.lang || `Subtitle ${i + 1}`,
        default:  isDefault,
        type:     'vtt'
    });
}

const _osCache = {};
async function fetchOpenSubtitles(tmdbId, type, season, episode) {
    if (!tmdbId) return [];
    const cacheKey = `${tmdbId}:${type}:${season}:${episode}`;
    if (_osCache[cacheKey]) return _osCache[cacheKey];

    const base = OPENSUBTITLES_PROXY_URL || 'https://api.opensubtitles.com/api/v1';
    const headers = { 'Accept': 'application/json' };
    if (!OPENSUBTITLES_PROXY_URL) headers['Api-Key'] = OPENSUBTITLES_API_KEY;

    const qs = new URLSearchParams({
        tmdb_id: tmdbId,
        type: type === 'movie' ? 'movie' : 'episode',
        languages: OPENSUBTITLES_LANGS
    });
    if (type !== 'movie') {
        qs.set('season_number', season);
        qs.set('episode_number', episode);
    }

    const searchRes = await fetch(`${base}/subtitles?${qs.toString()}`, { headers });
    if (!searchRes.ok) throw new Error('OpenSubtitles search failed: ' + searchRes.status);
    const searchData = await searchRes.json();

    const wanted = OPENSUBTITLES_LANGS.split(',').map(l => l.trim());
    const byLang = {};
    for (const item of (searchData.data || [])) {
        const attrs = item.attributes || {};
        const lang = attrs.language;
        if (!wanted.includes(lang)) continue;
        const file = (attrs.files || [])[0];
        if (!file) continue;
        (byLang[lang] = byLang[lang] || []).push({
            file_id: file.file_id,
            label: attrs.release || lang,
            downloads: attrs.download_count || 0
        });
    }
    Object.values(byLang).forEach(list => list.sort((a, b) => b.downloads - a.downloads));

    const results = [];
    for (const lang of wanted) {
        const candidates = (byLang[lang] || []).slice(0, 3); // try up to 3 before giving up
        let keptForLang = 0;
        for (const hit of candidates) {
            if (keptForLang >= OPENSUBTITLES_MAX_PER_LANG) break;
            try {
                const dlRes = await fetch(`${base}/download`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ file_id: hit.file_id })
                });
                if (!dlRes.ok) continue;
                const dlData = await dlRes.json();
                const fileRes = await fetch(dlData.link);
                const srtText = await fileRes.text();

                const vttBlob = new Blob([srtToVtt(srtText)], { type: 'text/vtt' });
                results.push({
                    src:     URL.createObjectURL(vttBlob),
                    lang:    lang,
                    // First kept variant per language keeps the plain
                    // "EN (OpenSubtitles)" label + default flag; extra
                    // variants are labeled with their release name so
                    // they're distinguishable in the subtitles menu.
                    label:   keptForLang === 0
                        ? `${lang.toUpperCase()} (OpenSubtitles)`
                        : `${lang.toUpperCase()} — ${hit.label}`,
                    default: keptForLang === 0 && lang === OPENSUBTITLES_DEFAULT_LANG
                });
                keptForLang++;
            } catch (err) {
                console.warn('[auto-server] OpenSubtitles download failed for', lang, err);
            }
        }
    }

    _osCache[cacheKey] = results;
    return results;
}

function srtToVtt(srt) {
    const body = srt
        .replace(/\r+/g, '')
        .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
    return 'WEBVTT\n\n' + body;
}

function renderDirectSourceNative(source, srcType, idx) {
    disposePlayer();
    document.getElementById('iframe-container').style.display = 'none';
    document.getElementById('iframe-container').innerHTML = '';

    const el = document.getElementById('media-player-el');
    el.style.display = 'block';

    // Vidstack has built-in YouTube/Vimeo providers, so those are handed
    // their normalized watch-page URLs with a matching `type`, rather than
    // being sent to the iframe-embed path.
    if (srcType === 'youtube') {
        const vid = extractYouTubeId(source.src) || source.src;
        el.src = { src: `https://www.youtube.com/watch?v=${vid}`, type: 'video/youtube' };
    } else if (srcType === 'vimeo') {
        const vid = extractVimeoId(source.src) || source.src;
        el.src = { src: `https://vimeo.com/${vid}`, type: 'video/vimeo' };
    } else {
        const isHLS = srcType === 'hls' || source.src.includes('.m3u8');

        // Live sources need stream-type='live' or Vidstack treats the manifest
        // like an on-demand video and waits indefinitely for VOD-style signals
        // that a live stream never sends, leaving the buffering spinner stuck.
        // Set as an ATTRIBUTE (not the `streamType` JS property) — Vidstack's
        // docs configure this declaratively, and driving it through the same
        // observed-attribute pipeline avoids poking the property setter
        // directly, which can run provider-reconfig logic before the
        // freshly (re)created element's provider is fully wired up.
        el.setAttribute('stream-type', source.live ? 'live' : 'on-demand');
        el.src = { src: source.src, type: isHLS ? 'application/x-mpegurl' : 'video/mp4' };
    }

    // Keep title/poster in sync with whatever source is playing so the
    // player never falls back to an empty a11y title, matching the
    // title/poster fields in the player config.
    el.title  = source.title  || directList[idx]?.label || 'Video';
    el.poster = source.poster || '';

    // Wire the default video layout's thumbnail preview strip up to the
    // per-source thumbnails VTT (falls back to none if not provided).
    const layout = el.querySelector('media-video-layout');
    if (layout) layout.thumbnails = source.thumbnails || '';

    mediaPlayer = el;

    const onLoadedData = () => {
        if (directActiveIdx === idx) {
            directStatus[idx] = 'playing';
            renderServerList();
        }
        el.removeEventListener('loaded-data', onLoadedData);
    };
    el.addEventListener('loaded-data', onLoadedData);

    const onError = () => {
        console.warn('[auto-server] Vidstack: source failed (idx=' + idx + ')');
        el.removeEventListener('error', onError);
        disposePlayer();
        el.style.display = 'none';
        directStatus[idx] = 'error';
        renderServerList();
        playDirectSourceAt(idx + 1);
    };
    el.addEventListener('error', onError);

    addSubtitleTracks(el, source);
    addChapterTrack(el, source);
}

function addChapterTrack(player, source) {
    if (!source || !source.chapters) return;
    player.textTracks.add({
        kind:    'chapters',
        src:     source.chapters,
        default: true,
        type:    'vtt'
    });
}

function buildDirectIframeUrl(s, srcType) {
    switch (srcType) {
        case 'youtube': {
            const vid = extractYouTubeId(s.src);
            return vid ? `https://www.youtube.com/embed/${vid}?modestbranding=1&rel=0&autoplay=1` : null;
        }
        case 'dailymotion': {
            const vid = extractDailymotionId(s.src);
            const url = vid ? `https://www.dailymotion.com/embed/video/${vid}` : s.src;
            // Preserve a playlist param from the original URL, if present —
            // several library entries use ?playlist=xID to autoplay through
            // a related-videos queue.
            const playlistMatch = s.src.match(/[?&]playlist=([^&]+)/);
            const withPlaylist = playlistMatch ? appendParam(url, 'playlist', playlistMatch[1]) : url;
            return appendParam(withPlaylist, 'autoplay', '0');
        }
        case 'google-drive': {
            const m = s.src.match(/\/d\/(.+?)\//);
            return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
        }
        case 'mega':     return s.src.replace('/file/', '/embed/');
        case 'vimeo': {
            const vid = extractVimeoId(s.src);
            return vid ? `https://player.vimeo.com/video/${vid}?autoplay=1&dnt=1` : null;
        }
        case 'vk':       return appendParam(s.src, 'autoplay', '1');
        case 'telegram': return appendParam(appendParam(s.src, 'embed', '1'), 'autoplay', '1');
        case 'facebook': {
            const base = s.src.includes('plugins/video.php')
                ? s.src
                : `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(s.src)}&show_text=false`;
            return appendParam(base, 'autoplay', '1');
        }
        default:         return s.src;
    }
}

function autoFallbackToEmbed(reason) {
    console.info(`[auto-server] Falling back to embed (${reason})`);
    mode = 'embed';
    setActiveTab('embed');
    provIdx = 0;
    showBar();
    loadEmbed(0);
}

function switchMode(m) {
    if (m === mode && m === 'direct' && directSources) return;

    clearTimers();

    if (m === 'direct') {
        if (directSources) {
            clearEmbed();
            playDirect(directSources);
        } else {
            flashTab('tab-direct');
        }
    } else {
        mode = 'embed';
        disposePlayer();
        document.getElementById('media-player-el').style.display = 'none';
        clearEmbed();
        setActiveTab('embed');
        showBar();
        loadEmbed(provIdx);
    }
}

function flashTab(id) {
    const el = document.getElementById(id);
    el.style.opacity = '0.4';
    setTimeout(() => el.style.opacity = '', 600);
}

function loadEmbed(idx) {
    clearTimers();
    if (idx < 0 || idx >= EMBED_PROVIDERS.length) return;

    provIdx = idx;
    const prov = EMBED_PROVIDERS[idx];
    const url  = buildEmbedUrl(TYPE === 'movie' ? prov.movie : prov.tv);

    spin(`Connecting to ${prov.name}…`);
    // Reset any other server still marked "playing"/"fetching" from a prior
    // attempt now that it's no longer the active one.
    embedStatus = embedStatus.map((s, i) => i === idx ? 'fetching' : (s === 'playing' || s === 'fetching' ? 'idle' : s));
    renderServerList();
    setLabel(`Embed · ${prov.name}`);

    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = '';

    const wrapper = document.createElement('div');
    wrapper.className = 'iframe-wrapper';

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.className = 'ext-iframe';
    iframe.setAttribute('allow', 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

    iframe.onload = () => {
        clearTimers();
        unspin();
        embedStatus[idx] = 'playing';
        renderServerList();
        hideBar();
    };

    iframe.onerror = () => {
        // Hard network failure — skip immediately
        clearTimers();
        embedStatus[idx] = 'error';
        renderServerList();
        console.warn(`[auto-server] Network error: ${prov.name}`);
        tryNextEmbed();
    };

    // After SLOW_MS with no load, update label but don't auto-advance
    slowTimer = setTimeout(() => {
        unspin();
        setLabel(`Embed · ${prov.name} (slow…)`);
        renderServerList();
    }, SLOW_MS);

    wrapper.appendChild(iframe);
    container.appendChild(wrapper);
}

function tryNextEmbed() {
    const next = provIdx + 1;
    if (next >= EMBED_PROVIDERS.length) {
        unspin();
        showError('All embed sources failed. Please try again later.');
        return;
    }
    loadEmbed(next);
}

function clearEmbed() {
    clearTimers();
    const c = document.getElementById('iframe-container');
    c.style.display = 'none';
    c.innerHTML = '';
}

function disposePlayer() {
    // Previously this destroyed and recreated the whole <media-player>
    // custom element on every source switch. That's a risky pattern with
    // Vidstack's signals-based reactive core (see vidstack-CN2DhJ-S.js):
    // the old instance's cleanup effects are scheduled via queueMicrotask,
    // and if one of those fires *after* a brand-new instance has already
    // reset shared/internal state, it can read from something that's now
    // null deep inside the framework — which matches the crash we hit.
    //
    // Reusing a single persistent element and just clearing its source
    // avoids tearing down/recreating the element (and its internal
    // reactive graph) altogether, sidestepping that whole race.
    if (!mediaPlayer) return;
    const el = document.getElementById('media-player-el');
    try { el.src = ''; } catch {}
    // Clear any text tracks left over from the previous source so stale
    // subtitle/chapter tracks don't linger onto the next one.
    try {
        const tracks = el.textTracks ? Array.from(el.textTracks) : [];
        tracks.forEach(t => { try { el.textTracks.remove(t); } catch {} });
    } catch {}
    mediaPlayer = null;
}

function clearTimers() {
    clearTimeout(slowTimer);
    clearTimeout(autoTimer);
    slowTimer = null;
    autoTimer = null;
}

function buildEmbedUrl(t) {
    return t.replace(/\[ID\]/g, TMDB).replace(/\[S\]/g, SN).replace(/\[E\]/g, EP);
}

function detectType(src) {
    if (!src) return 'mp4';
    if (src.includes('.m3u8'))                                    return 'hls';
    if (src.includes('youtube.com') || src.includes('youtu.be')) return 'youtube';
    if (src.includes('vimeo.com'))                               return 'vimeo';
    if (src.includes('dailymotion.com'))                         return 'dailymotion';
    if (src.includes('drive.google.com'))                        return 'google-drive';
    if (src.includes('mega.nz'))                                 return 'mega';
    if (src.includes('vk.com'))                                  return 'vk';
    if (src.includes('t.me') || src.includes('telegram'))        return 'telegram';
    if (src.includes('facebook.com'))                            return 'facebook';
    return 'mp4';
}

function appendParam(url, key, val) {
    if (url.includes(`${key}=`)) return url;
    return url + (url.includes('?') ? '&' : '?') + `${key}=${val}`;
}

function extractYouTubeId(url) {
    const m = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]{11})/);
    return m ? m[1] : null;
}

function extractVimeoId(url) {
    const m = url.match(/vimeo\.com\/(?:video\/|channels\/(?:\w+\/)?|groups\/(?:[^\/]+)\/videos\/)?(\d+)/);
    return m ? m[1] : null;
}

function extractDailymotionId(url) {
    // Matches every shape seen in the library: watch pages
    // (dailymotion.com/video/xID), plain embed pages (dailymotion.com/embed/xID),
    // explicit embed/video pages (dailymotion.com/embed/video/xID), and
    // short links (dai.ly/xID). The optional "video/" segment covers both
    // embed URL styles Dailymotion has used.
    const m = url.match(/(?:dailymotion\.com\/(?:embed\/)?(?:video\/)?|dai\.ly\/)([a-zA-Z0-9]+)/);
    return m ? m[1] : null;
}

async function init() {
    if (!TMDB) { showError('No content ID provided.'); return; }
    await startDirect();
}

init();</script></body></html>
