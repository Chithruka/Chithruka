<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chithruka Server</title>
    <link href="https://unpkg.com/video.js@7/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@7/dist/video.min.js"></script>
    <script src="https://unpkg.com/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
    <script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>
    <link href="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.css" rel="stylesheet">
    <script src="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; }
body, html { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; font-family:'Poppins',sans-serif; }
#player-container { width:100%; height:100%; position:relative; }
.video-js  { width:100% !important; height:100% !important; }
.ext-iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
#iframe-container { display:none; position:absolute; top:0; left:0; width:100%; height:100%; }
.iframe-wrapper   { position:relative; width:100%; height:100%; }

/* ── Control bar ─────────────────────────────────────────────────────────── */
/* Sits at the very bottom; always visible while in embed mode, hidden in direct */
#control-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    padding: 10px 14px 12px;
    display: none;           /* shown by JS when needed */
    flex-direction: column;
    gap: 8px;
    z-index: 120;
    transition: opacity 0.3s ease;
}
#control-bar.visible { display: flex; }

/* Top row: mode tabs + current source label */
#bar-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.mode-tab {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #aaa;
    cursor: pointer;
    letter-spacing: .5px;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
}
.mode-tab.active {
    background: #d80027;
    border-color: #d80027;
    color: #fff;
}
.mode-tab:hover:not(.active) { background: rgba(255,255,255,0.1); color: #fff; }

#source-label {
    color: #888;
    font-size: 11px;
    margin-left: auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
}

/* Bottom row: provider buttons (embed / links modes only) */
#provider-row,
#links-provider-row {
    display: none;
    gap: 6px;
    flex-wrap: wrap;
}
#provider-row.visible,
#links-provider-row.visible { display: flex; }

#bar-close {
    background: transparent;
    border: none;
    color: #666;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    margin-left: 6px;
    flex-shrink: 0;
    transition: color 0.2s;
}
#bar-close:hover { color: #fff; }


    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.07);
    color: #ccc;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
}
.prov-btn:hover  { background: rgba(255,255,255,0.15); color:#fff; }
.prov-btn.active { background:#d80027; border-color:#d80027; color:#fff; }
.prov-btn.trying { border-color: rgba(216,0,39,0.5); color:#d80027; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Spinner ─────────────────────────────────────────────────────────────── */
#spinner {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 115;
    pointer-events: none;
}
#spinner.visible { display: flex; }
.spin-ring {
    width: 42px; height: 42px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #d80027;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.spin-label { color:#777; font-size:12px; }

/* ── Error ───────────────────────────────────────────────────────────────── */
#error-msg {
    display: none;
    color: #fff;
    font-size: 15px;
    text-align: center;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.75);
    padding: 20px 28px;
    border-radius: 8px;
    border-left: 4px solid #d80027;
    z-index: 130;
    max-width: 80%;
}

/* ── VideoJS skin ────────────────────────────────────────────────────────── */
.video-js { font-family:'Poppins',sans-serif !important; }
.video-js .vjs-play-progress,
.video-js .vjs-volume-level { background:#d80027 !important; }
.video-js .vjs-control-bar  { background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 100%) !important; }
.video-js .vjs-big-play-button {
    background:rgba(0,0,0,.5) !important;
    border:2px solid #d80027 !important;
    border-radius:50% !important;
    width:2.5em !important; height:2.5em !important;
    line-height:2.3em !important;
    margin-top:-1.25em !important; margin-left:-1.25em !important;
}
.video-js:hover .vjs-big-play-button,
.video-js .vjs-big-play-button:hover,
.video-js .vjs-big-play-button:focus {
    border-color:#d80027 !important;
    background:rgba(216,0,39,.2) !important;
    outline:none !important;
}
.video-js .vjs-control:hover,
.video-js .vjs-control:focus {
    color:#d80027 !important; outline:none !important;
    text-shadow:0 0 5px rgba(216,0,39,.5) !important;
}

/* ── Cosmos top bar (inside VideoJS) ─────────────────────────────────────── */
.vjs-cosmos-top-bar {
    position:absolute; top:0; left:0; width:100%;
    background:linear-gradient(to bottom,rgba(0,0,0,.8) 0%,transparent 100%);
    padding:10px 15px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10;
    transition:opacity .3s ease; gap:15px;
}
.vjs-cosmos-title-container { border-left:4px solid #d80027; padding-left:12px; flex:1; min-width:0; }
.vjs-cosmos-title { color:#fff; font-size:18px; font-weight:600; margin:0; text-transform:capitalize; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vjs-cosmos-desc  { color:#aaa; font-size:12px; margin:2px 0 0 0; text-transform:uppercase; letter-spacing:1px; }
.vjs-cosmos-logo  { max-height:30px; pointer-events:auto; flex-shrink:0; }
.vjs-user-inactive .vjs-cosmos-top-bar { opacity:0; }

/* ── Intro overlay ───────────────────────────────────────────────────────── */
#intro-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:#000; z-index:200;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease;
}
#intro-overlay.fade-out { opacity:0; pointer-events:none; }
#intro-player-wrap { width:100%; height:100%; position:relative; }
#intro-vjs-player  { width:100% !important; height:100% !important; }
</style>
</head>
<body>
<div id="player-container">

    <!-- Intro branding -->
    <div id="intro-overlay">
        <div id="intro-player-wrap">
            <video id="intro-vjs-player" class="video-js vjs-big-play-centered"></video>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner">
        <div class="spin-ring"></div>
        <span class="spin-label" id="spin-label">Loading…</span>
    </div>

    <!-- VideoJS direct player -->
    <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>

    <!-- Iframe embed container -->
    <div id="iframe-container"></div>

    <!-- Error -->
    <div id="error-msg"></div>

    <!-- ── Control bar (bottom) ── -->
    <div id="control-bar">
        <!-- Row 1: mode tabs + label -->
        <div id="bar-top">
            <button id="tab-direct" class="mode-tab active" onclick="switchMode('direct')">⬤ Direct</button>
            <button id="tab-links"  class="mode-tab"        onclick="switchMode('links')">🔗 Links</button>
            <button id="tab-embed"  class="mode-tab"        onclick="switchMode('embed')">⊞ Embed</button>
            <span id="source-label"></span>
            <button id="bar-close" onclick="hideBar()" title="Close">✕</button>
        </div>
        <!-- Row 2: provider buttons (embed only) -->
        <div id="provider-row">
            <!-- populated by JS -->
        </div>
        <!-- Row 3: generated-link format buttons (links mode only) -->
        <div id="links-provider-row">
            <!-- populated by JS -->
        </div>
    </div>

</div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  CONFIG  — edit here only
// ═══════════════════════════════════════════════════════════════════════════

const VIDEOS_JSON_PATH = 'videos.json';

// Embed providers — tried in order when in embed mode.
// [ID] = TMDB id, [S] = season, [E] = episode
const EMBED_PROVIDERS = [
    { name: 'VidRock',  movie: 'https://vidrock.ru/movie/[ID]',            tv: 'https://vidrock.ru/tv/[ID]/[S]/[E]' },
    { name: 'VidLink',     movie: 'https://vidlink.pro/movie/[ID]?autoplay=false',   tv: 'https://vidlink.pro/tv/[ID]/[S]/[E]?autoplay=false' },
    { name: 'VidSrc WTF',  movie: 'https://www.vidsrc.wtf/4/movie/[ID]',            tv: 'https://www.vidsrc.wtf/4/tv/[ID]/[S]/[E]' },
    { name: '1Embed',      movie: 'https://1embed.cc/embed/movie/[ID]',              tv: 'https://1embed.cc/embed/tv/[ID]/[S]/[E]' },
    { name: '2Embed',      movie: 'https://www.2embed.cc/embed/[ID]',               tv: 'https://www.2embed.cc/embedtv/[ID]&s=[S]&e=[E]' },
];

// ── Generated Links (Baiscope) ───────────────────────────────────────────────
// Mirrors link.html: fetches the movie's title/year from TMDB, then builds two
// candidate direct-file URLs (dots-format and underscores-format filenames).
// Each is probed in a hidden <video> element; the first that loads wins.
// Movies only — link.html has no season/episode support, so TV falls straight
// through to Embed.
const TMDB_API_KEY      = '92850a79e50917b8cc19623455ae2240'; // set your TMDB v3 API key here to enable this step
const BAISCOPE_BASE_URL = 'https://media.baiscopewatch.com/file/Movies01-Baiscopelk/movies/';

function baiscopeDotsName(title) {
    return title
        .replace(/[^a-zA-Z0-9]/g, '.')
        .replace(/\.+/g, '.')
        .replace(/(^\.|\.$)/g, '');
}
function baiscopeUnderscoresName(title) {
    return title
        .replace(/[^a-zA-Z0-9]/g, '_')
        .replace(/_+/g, '_')
        .replace(/(^_|_$)/g, '');
}

const GENERATED_LINK_FORMATS = [
    { name: 'Format 1 (Dots)',        build: (title, year) => `${BAISCOPE_BASE_URL}${baiscopeDotsName(title)}.${year}.mp4` },
    { name: 'Format 2 (Underscores)', build: (title, year) => `${BAISCOPE_BASE_URL}${baiscopeUnderscoresName(title)}_${year}.mp4` },
];

// How long to wait for each candidate link to prove it's playable
const LINK_PROBE_MS = 10000;

// If an iframe hasn't fired onload after this many ms, mark it as "slow"
const SLOW_MS   = 8000;
// Auto-advance to next embed after this many ms of silence (0 = never auto-advance)
const AUTO_MS   = 0;

const INTRO_SRC = 'https://chithruka.github.io/Chithruka/Landing/src/video-devices-in-lq.mp4';
const LOGO_SRC  = '../Attachments/Chithruka%20Streamer%20Logo.svg';

// ═══════════════════════════════════════════════════════════════════════════
//  URL PARAMS
// ═══════════════════════════════════════════════════════════════════════════

const _p   = new URLSearchParams(window.location.search);
const TMDB = _p.get('id')   || '';
const TYPE = _p.get('type') || 'movie';
const SN   = _p.get('s')    || '1';
const EP   = _p.get('e')    || '1';

// ═══════════════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════════════

let mode          = 'direct';  // 'direct' | 'links' | 'embed'
let directSources = null;      // array from videos.json, or null
let workingLink   = null;      // { name, url } of the generated link that proved playable, or null
let lastLookup    = null;      // { title, year } from the last successful TMDB lookup, or null
let linkIdx       = 0;         // current GENERATED_LINK_FORMATS index being tried
let provIdx       = 0;         // current EMBED_PROVIDERS index
let slowTimer     = null;
let autoTimer     = null;
let vjsPlayer     = null;      // active VideoJS instance

// ═══════════════════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function spin(msg)  { document.getElementById('spin-label').textContent = msg || 'Loading…'; document.getElementById('spinner').classList.add('visible'); }
function unspin()   { document.getElementById('spinner').classList.remove('visible'); }

function setLabel(txt) { document.getElementById('source-label').textContent = txt; }

function showError(msg) {
    document.getElementById('intro-overlay').style.display = 'none';
    unspin();
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

function showBar()  { document.getElementById('control-bar').classList.add('visible'); }
function hideBar()  { document.getElementById('control-bar').classList.remove('visible'); }

// ── Mode tabs ───────────────────────────────────────────────────────────────
function setActiveTab(m) {
    document.getElementById('tab-direct').classList.toggle('active', m === 'direct');
    document.getElementById('tab-links').classList.toggle('active',  m === 'links');
    document.getElementById('tab-embed').classList.toggle('active',  m === 'embed');
    document.getElementById('provider-row').classList.toggle('visible', m === 'embed');
    document.getElementById('links-provider-row').classList.toggle('visible', m === 'links');
}

// ── Provider buttons ────────────────────────────────────────────────────────
function renderProviderButtons(activeIdx, isTrying) {
    const row = document.getElementById('provider-row');
    row.innerHTML = '';
    EMBED_PROVIDERS.forEach((p, i) => {
        const btn = document.createElement('button');
        btn.className = 'prov-btn' +
            (i === activeIdx && !isTrying ? ' active' : '') +
            (i === activeIdx &&  isTrying ? ' trying' : '');
        btn.textContent = p.name;
        btn.onclick = () => loadEmbed(i);
        row.appendChild(btn);
    });
}

// ═══════════════════════════════════════════════════════════════════════════
//  DIRECT MODE  (videos.json → VideoJS / source iframes)
// ═══════════════════════════════════════════════════════════════════════════

async function startDirect() {
    if (!TMDB) { showError('No content ID provided.'); return; }

    spin('Looking up your library…');

    const db = await fetchDB();
    if (!db) {
        // Can't even reach the DB — try generated links next
        unspin();
        autoFallbackToLinks('Library unavailable');
        return;
    }

    const sources = TYPE === 'movie'
        ? db.movies?.[TMDB]
        : db.tv?.[TMDB]?.[SN]?.[EP];

    if (!sources || sources.length === 0) {
        unspin();
        autoFallbackToLinks('Not in local library');
        return;
    }

    directSources = sources;
    unspin();
    playDirect(sources);
}

async function fetchDB() {
    try {
        const res = await fetch(VIDEOS_JSON_PATH);
        if (!res.ok) return null;
        return await res.json();
    } catch { return null; }
}

function playDirect(sources) {
    mode = 'direct';
    setActiveTab('direct');

    // Clear any running embed
    clearEmbed();

    const first   = sources[0];
    const srcType = first.type || detectType(first.src);

    // Native VideoJS types
    if (srcType === 'mp4' || srcType === 'hls' || !first.src.match(/youtube|vimeo|dailymotion|drive\.google|mega\.nz|vk\.com|t\.me|telegram|facebook/)) {
        playDirectVideoJS(sources, srcType);
        return;
    }

    // Iframe-based types from your DB (YouTube, Dailymotion, etc.)
    playDirectIframe(sources, srcType);
}

function playDirectVideoJS(sources, srcType) {
    disposeVJS();
    const el = document.getElementById('vjs-player');
    el.style.display = 'block';

    const isHLS = srcType === 'hls' || sources[0].src.includes('.m3u8');
    const typeLabel = TYPE === 'tv' ? 'TV SHOW' : 'MOVIE';
    const rawName   = sources[0].src.split('/').pop().split('?')[0].split('.')[0];
    const title     = decodeURIComponent(rawName).replace(/[-_]/g, ' ');

    const opts = {
        controls: true, autoplay: false, fill: true,
        sources: sources.map(s => ({
            src:   s.src,
            type:  (s.type === 'hls' || s.src.includes('.m3u8')) ? 'application/vnd.apple.mpegurl' : 'video/mp4',
            label: s.label || undefined
        })),
        plugins: {}
    };

    if (!isHLS) {
        opts.plugins.vjsdownload = {
            beforeElement: 'fullscreenToggle',
            textControl:   'Download Video',
            name:          'downloadButton',
            downloadURL:   sources[0].src
        };
    }

    vjsPlayer = videojs('vjs-player', opts);
    if (isHLS) vjsPlayer.ready(() => vjsPlayer.httpSourceSelector());

    vjsPlayer.ready(() => {
        const topBar = document.createElement('div');
        topBar.className = 'vjs-cosmos-top-bar';
        topBar.innerHTML = `
            <div class="vjs-cosmos-title-container">
                <h1 class="vjs-cosmos-title">${title}</h1>
                <p class="vjs-cosmos-desc">${typeLabel}</p>
            </div>
            <img class="vjs-cosmos-logo" src="${LOGO_SRC}"
                 oncontextmenu="return false;" ondragstart="return false;"
                 onselectstart="return false;" alt="Logo">`;
        vjsPlayer.el().appendChild(topBar);
    });

    // All sources failed → fall to next tier
    vjsPlayer.on('error', () => {
        console.warn('[auto-server] VideoJS: all sources failed (mode=' + mode + ')');
        disposeVJS();
        el.style.display = 'none';
        if (mode === 'direct') {
            autoFallbackToLinks('Direct sources failed');
        } else {
            autoFallbackToEmbed('Playback failed');
        }
    });

    setLabel('Direct · ' + (sources.length > 1 ? sources.length + ' sources' : 'My Server'));
    showBar();
}

function playDirectIframe(sources, srcType) {
    const url = buildDirectIframeUrl(sources[0], srcType);
    if (!url) { autoFallbackToLinks('Invalid source URL'); return; }

    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = '';

    const wrapper = document.createElement('div');
    wrapper.className = 'iframe-wrapper';

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.className = 'ext-iframe';
    iframe.setAttribute('allow', 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    iframe.onload  = unspin;
    iframe.onerror = () => autoFallbackToLinks('Source failed to load');

    wrapper.appendChild(iframe);
    container.appendChild(wrapper);

    setLabel('Direct · ' + srcType);
    showBar();
}

function buildDirectIframeUrl(s, srcType) {
    switch (srcType) {
        case 'youtube': {
            const vid = extractYouTubeId(s.src);
            return vid ? `https://www.youtube.com/embed/${vid}?modestbranding=1&rel=0&autoplay=1` : null;
        }
        case 'dailymotion': {
            let url = s.src.replace(/\/embed\/(?!video\/|playlist\/)/, '/embed/video/');
            return appendParam(url, 'autoplay', '1');
        }
        case 'google-drive': {
            const m = s.src.match(/\/d\/(.+?)\//);
            return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
        }
        case 'mega':     return s.src.replace('/file/', '/embed/');
        case 'vimeo': {
            const vid = extractVimeoId(s.src);
            return vid ? `https://player.vimeo.com/video/${vid}?autoplay=1&dnt=1` : null;
        }
        case 'vk':       return appendParam(s.src, 'autoplay', '1');
        case 'telegram': return appendParam(appendParam(s.src, 'embed', '1'), 'autoplay', '1');
        case 'facebook': {
            const base = s.src.includes('plugins/video.php')
                ? s.src
                : `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(s.src)}&show_text=false`;
            return appendParam(base, 'autoplay', '1');
        }
        default:         return s.src;
    }
}

// Silent auto-fallback: direct sources failed/unavailable, try generated links next
function autoFallbackToLinks(reason) {
    console.info(`[auto-server] Direct failed (${reason}) — trying generated links`);
    startGeneratedLinks();
}

// Silent auto-fallback: generated links exhausted/unsupported, go straight to embed
function autoFallbackToEmbed(reason) {
    console.info(`[auto-server] Falling back to embed (${reason})`);
    mode = 'embed';
    setActiveTab('embed');
    provIdx = 0;
    renderProviderButtons(0, true);
    showBar();
    loadEmbed(0);
}

// ═══════════════════════════════════════════════════════════════════════════
//  GENERATED LINKS MODE  (direct-file URLs built from TMDB title/year)
// ═══════════════════════════════════════════════════════════════════════════

// Probe a candidate URL using a hidden <video> element rather than fetch().
// media.baiscopewatch.com sends no Access-Control-Allow-Origin header, so a
// fetch() from the browser is blocked by CORS entirely (even for files that
// exist) — the browser refuses to let JS read the response. Loading media via
// a <video> element isn't subject to that restriction (CORS only gates JS
// reading response bytes, not playback), so we listen for its native
// loadedmetadata/error events instead.
// Resolves true if the file exists and is playable, false otherwise.
function testVideoUrl(url, timeoutMs = LINK_PROBE_MS) {
    return new Promise(resolve => {
        const probe = document.createElement('video');
        probe.preload = 'metadata';
        probe.muted = true;
        probe.style.display = 'none';

        let settled = false;
        const finish = (ok, reason) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            probe.removeAttribute('src');
            probe.load();
            probe.remove();
            if (!ok) console.info(`[auto-server] Link unavailable: ${reason}`);
            resolve(ok);
        };

        const timer = setTimeout(() => finish(false, 'timed out'), timeoutMs);

        probe.addEventListener('loadedmetadata', () => finish(true), { once: true });
        probe.addEventListener('error', () => {
            // MediaError codes: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED
            const code = probe.error ? probe.error.code : 0;
            finish(false, `media error ${code}`);
        }, { once: true });

        document.body.appendChild(probe);
        probe.src = url;
        probe.load();
    });
}

async function startGeneratedLinks() {
    mode = 'links';
    setActiveTab('links');
    renderLinkProviderButtons(-1, false);
    showBar();

    if (TYPE !== 'movie') {
        autoFallbackToEmbed('Generated links only support movies');
        return;
    }
    if (!TMDB_API_KEY) {
        autoFallbackToEmbed('No TMDB API key configured');
        return;
    }

    spin('Looking up movie info…');
    let title, year;
    try {
        const res = await fetch(`https://api.themoviedb.org/3/movie/${TMDB}?api_key=${TMDB_API_KEY}`);
        if (!res.ok) throw new Error('TMDB lookup failed');
        const data = await res.json();
        title = data.title;
        year  = data.release_date ? data.release_date.split('-')[0] : '';
        if (!title) throw new Error('No title returned');
        lastLookup = { title, year };
    } catch (err) {
        console.warn('[auto-server] Generated links: TMDB lookup failed', err);
        autoFallbackToEmbed('TMDB lookup failed');
        return;
    }

    for (let i = 0; i < GENERATED_LINK_FORMATS.length; i++) {
        linkIdx = i;
        const fmt = GENERATED_LINK_FORMATS[i];
        const url = fmt.build(title, year);
        renderLinkProviderButtons(i, true);
        spin(`Checking ${fmt.name}…`);

        const ok = await testVideoUrl(url);
        if (ok) {
            workingLink = { name: fmt.name, url };
            unspin();
            renderLinkProviderButtons(i, false);
            setLabel(`Links · ${fmt.name}`);
            playDirectVideoJS([{ src: url, type: 'mp4', label: fmt.name }], 'mp4');
            return;
        }

        console.info(`[auto-server] Generated link failed: ${fmt.name}`);
    }

    unspin();
    autoFallbackToEmbed('All generated links failed');
}

function renderLinkProviderButtons(activeIdx, isTrying) {
    const row = document.getElementById('links-provider-row');
    if (!row) return;
    row.innerHTML = '';
    GENERATED_LINK_FORMATS.forEach((f, i) => {
        const btn = document.createElement('button');
        btn.className = 'prov-btn' +
            (i === activeIdx && !isTrying ? ' active' : '') +
            (i === activeIdx &&  isTrying ? ' trying' : '');
        btn.textContent = f.name;
        btn.onclick = () => {
            if (!lastLookup) return;
            linkIdx = i;
            renderLinkProviderButtons(i, true);
            spin(`Checking ${f.name}…`);
            const url = f.build(lastLookup.title, lastLookup.year);
            testVideoUrl(url).then(ok => {
                if (ok) {
                    workingLink = { name: f.name, url };
                    unspin();
                    renderLinkProviderButtons(i, false);
                    setLabel(`Links · ${f.name}`);
                    playDirectVideoJS([{ src: url, type: 'mp4', label: f.name }], 'mp4');
                } else {
                    unspin();
                    renderLinkProviderButtons(i, false);
                    setLabel(`Links · ${f.name} (unavailable)`);
                }
            });
        };
        row.appendChild(btn);
    });
}

// ═══════════════════════════════════════════════════════════════════════════
//  EMBED MODE  (third-party provider iframes)
// ═══════════════════════════════════════════════════════════════════════════

function switchMode(m) {
    if (m === mode && m === 'direct' && directSources) return;

    clearTimers();

    if (m === 'direct') {
        if (directSources) {
            clearEmbed();
            playDirect(directSources);
        } else {
            flashTab('tab-direct');
        }
    } else if (m === 'links') {
        disposeVJS();
        document.getElementById('vjs-player').style.display = 'none';
        clearEmbed();
        if (workingLink) {
            mode = 'links';
            setActiveTab('links');
            renderLinkProviderButtons(linkIdx, false);
            showBar();
            setLabel(`Links · ${workingLink.name}`);
            playDirectVideoJS([{ src: workingLink.url, type: 'mp4', label: workingLink.name }], 'mp4');
        } else {
            startGeneratedLinks();
        }
    } else {
        mode = 'embed';
        disposeVJS();
        document.getElementById('vjs-player').style.display = 'none';
        clearEmbed();
        setActiveTab('embed');
        renderProviderButtons(provIdx, true);
        showBar();
        loadEmbed(provIdx);
    }
}

function flashTab(id) {
    const el = document.getElementById(id);
    el.style.opacity = '0.4';
    setTimeout(() => el.style.opacity = '', 600);
}

function loadEmbed(idx) {
    clearTimers();
    if (idx < 0 || idx >= EMBED_PROVIDERS.length) return;

    provIdx = idx;
    const prov = EMBED_PROVIDERS[idx];
    const url  = buildEmbedUrl(TYPE === 'movie' ? prov.movie : prov.tv);

    spin(`Connecting to ${prov.name}…`);
    renderProviderButtons(idx, true);
    setLabel(`Embed · ${prov.name}`);

    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = '';

    const wrapper = document.createElement('div');
    wrapper.className = 'iframe-wrapper';

    const iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.className = 'ext-iframe';
    iframe.setAttribute('allow', 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

    iframe.onload = () => {
        clearTimers();
        unspin();
        renderProviderButtons(idx, false); // mark as loaded (not "trying")
    };

    iframe.onerror = () => {
        // Hard network failure — skip immediately
        clearTimers();
        console.warn(`[auto-server] Network error: ${prov.name}`);
        tryNextEmbed();
    };

    // After SLOW_MS with no load, update label but don't auto-advance
    slowTimer = setTimeout(() => {
        unspin();
        setLabel(`Embed · ${prov.name} (slow…)`);
        renderProviderButtons(idx, true);
    }, SLOW_MS);

    wrapper.appendChild(iframe);
    container.appendChild(wrapper);
}

function tryNextEmbed() {
    const next = provIdx + 1;
    if (next >= EMBED_PROVIDERS.length) {
        unspin();
        showError('All embed sources failed. Please try again later.');
        return;
    }
    loadEmbed(next);
}

// ═══════════════════════════════════════════════════════════════════════════
//  CLEANUP HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function clearEmbed() {
    clearTimers();
    const c = document.getElementById('iframe-container');
    c.style.display = 'none';
    c.innerHTML = '';
}

function disposeVJS() {
    if (vjsPlayer) {
        try { vjsPlayer.dispose(); } catch {}
        vjsPlayer = null;
        // videojs dispose removes the element; recreate it
        const container = document.getElementById('player-container');
        const newEl = document.createElement('video');
        newEl.id = 'vjs-player';
        newEl.className = 'video-js vjs-big-play-centered';
        newEl.style.display = 'none';
        // Insert before iframe-container
        container.insertBefore(newEl, document.getElementById('iframe-container'));
    }
}

function clearTimers() {
    clearTimeout(slowTimer);
    clearTimeout(autoTimer);
    slowTimer = null;
    autoTimer = null;
}

// ═══════════════════════════════════════════════════════════════════════════
//  UTILITY
// ═══════════════════════════════════════════════════════════════════════════

function buildEmbedUrl(t) {
    return t.replace(/\[ID\]/g, TMDB).replace(/\[S\]/g, SN).replace(/\[E\]/g, EP);
}

function detectType(src) {
    if (!src) return 'mp4';
    if (src.includes('.m3u8'))                                    return 'hls';
    if (src.includes('youtube.com') || src.includes('youtu.be')) return 'youtube';
    if (src.includes('vimeo.com'))                               return 'vimeo';
    if (src.includes('dailymotion.com'))                         return 'dailymotion';
    if (src.includes('drive.google.com'))                        return 'google-drive';
    if (src.includes('mega.nz'))                                 return 'mega';
    if (src.includes('vk.com'))                                  return 'vk';
    if (src.includes('t.me') || src.includes('telegram'))        return 'telegram';
    if (src.includes('facebook.com'))                            return 'facebook';
    return 'mp4';
}

function appendParam(url, key, val) {
    if (url.includes(`${key}=`)) return url;
    return url + (url.includes('?') ? '&' : '?') + `${key}=${val}`;
}

function extractYouTubeId(url) {
    const m = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]{11})/);
    return m ? m[1] : null;
}

function extractVimeoId(url) {
    const m = url.match(/vimeo\.com\/(?:video\/|channels\/(?:\w+\/)?|groups\/(?:[^\/]+)\/videos\/)?(\d+)/);
    return m ? m[1] : null;
}

// ═══════════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════════

async function init() {
    if (!TMDB) { showError('No content ID provided.'); return; }
    await startDirect(); // always starts in direct mode
}

// ═══════════════════════════════════════════════════════════════════════════
//  INTRO
// ═══════════════════════════════════════════════════════════════════════════

function playIntro() {
    return new Promise(resolve => {
        const overlay = document.getElementById('intro-overlay');
        let ended = false;

        const p = videojs('intro-vjs-player', {
            controls:false, autoplay:false, muted:false, fill:true,
            sources:[{ src:INTRO_SRC, type:'video/mp4' }]
        });

        function end() {
            if (ended) return; ended = true;
            p.dispose();
            overlay.classList.add('fade-out');
            setTimeout(() => { overlay.style.display='none'; resolve(); }, 500);
        }

        p.ready(function() {
            const play = p.play();
            if (play && typeof play.then === 'function') {
                play.catch(() => {
                    p.muted(true);
                    const p2 = p.play();
                    if (p2 && typeof p2.then === 'function') p2.catch(end);
                });
            }
        });
        p.on('ended', end);
        p.on('error', end);
    });
}

(async () => {
    await playIntro();
    await init();
})();
</script>
