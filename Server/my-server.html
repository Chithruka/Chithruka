<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Source Server</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
        }
        #player-container { 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        .video-js, .external-iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none; 
        }
        #error-msg { 
            color: white; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            text-align: center; 
            display: none; 
            font-family: sans-serif; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="error-msg">Checking source...</div>
        <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>
        <div id="iframe-container" style="display:none; width:100%; height:100%;"></div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
    async function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type');
        const s = params.get('s'); 
        const e = params.get('e'); 
        const errorEl = document.getElementById('error-msg');

        try {
            // Fetch the JSON database
            const res = await fetch('videos.json');
            if (!res.ok) throw new Error("Database not found");
            
            const db = await res.json();
            let sources = null;

            // Determine if it's a movie or TV show based on URL params
            if (type === 'movie') {
                sources = db.movies[id];
            } else if (type === 'tv') {
                if (db.tv && db.tv[id] && db.tv[id][s] && db.tv[id][s][e]) {
                    sources = db.tv[id][s][e];
                }
            }

            if (!sources || sources.length === 0) {
                errorEl.innerText = type === 'tv' ? `Episode S${s}:E${e} not found.` : "Movie not found.";
                errorEl.style.display = 'block';
                return;
            }

            setupPlayer(sources);

        } catch (err) {
            errorEl.innerText = "System Error: Unable to load video database.";
            errorEl.style.display = 'block';
        }
    }

    function setupPlayer(sources) {
        const firstSource = sources[0];

        // Reset UI
        document.getElementById('vjs-player').style.display = 'none';
        document.getElementById('iframe-container').style.display = 'none';

        // 1. YouTube - Using Native Embed Method
        if (firstSource.type === 'youtube') {
            let videoId = '';
            // Handle standard watch?v= format
            if (firstSource.src.includes('v=')) {
                videoId = firstSource.src.split('v=')[1].split('&')[0];
            } 
            // Handle shortened youtu.be/ format
            else if (firstSource.src.includes('youtu.be/')) {
                videoId = firstSource.src.split('/').pop();
            }
            
            if (videoId) {
                showIframe(`https://www.youtube.com/embed/${videoId}?rel=0&autoplay=1`);
            } else {
                console.error("Invalid YouTube URL");
            }
        } 
        // 2. Google Drive
        else if (firstSource.type === 'google-drive') {
            const videoId = firstSource.src.match(/\/d\/(.+?)\//)[1];
            showIframe(`https://drive.google.com/file/d/${videoId}/preview`);
        }
        // 3. Dailymotion
        else if (firstSource.type === 'dailymotion') {
            const videoId = firstSource.src.split('/').pop();
            showIframe(`https://www.dailymotion.com/embed/video/${videoId}`);
        }
        // 4. Mega.nz
        else if (firstSource.type === 'mega') {
            const megaEmbed = firstSource.src.replace('/file/', '/embed/');
            showIframe(megaEmbed);
        }
        // 5. Telegram
        else if (firstSource.type === 'telegram') {
            const telId = firstSource.src.split('t.me/')[1];
            showIframe(`https://t.me/${telId}?embed=1`);
        }
        // 6. HLS and Direct Video links (MP4)
        else {
            let mimeType = 'video/mp4';
            if (firstSource.type === 'hls' || firstSource.src.includes('.m3u8')) {
                mimeType = 'application/x-mpegURL';
            }
            showVideoJS(sources, mimeType);
        }
    }

    function showVideoJS(sources, mimeType) {
        const playerContainer = document.getElementById('player-container');
        
        // Clean up existing instance if it exists
        if (videojs.getPlayers()['vjs-player']) {
            videojs('vjs-player').dispose();
            playerContainer.insertAdjacentHTML('beforeend', '<video id="vjs-player" class="video-js vjs-big-play-centered"></video>');
        }

        const el = document.getElementById('vjs-player');
        el.style.display = 'block';

        videojs('vjs-player', {
            controls: true,
            autoplay: false,
            fluid: true,
            sources: sources.map(s => ({
                src: s.src,
                type: (s.type === 'hls' || s.src.includes('.m3u8')) ? 'application/x-mpegURL' : 'video/mp4'
            }))
        });
    }

    function showIframe(url) {
        const container = document.getElementById('iframe-container');
        container.style.display = 'block';
        container.innerHTML = `<iframe 
            src="${url}" 
            class="external-iframe" 
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen="true" 
            frameborder="0"></iframe>`;
    }

    init();
    </script>
</body>
</html>
