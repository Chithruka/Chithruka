<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chithruka Server</title>
    <link href="https://unpkg.com/video.js@7/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@7/dist/video.min.js"></script>

    <script src="https://unpkg.com/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
    <script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>

    <link href="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.css" rel="stylesheet">
    <script src="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    .video-js, .external-iframe { width: 100% !important; height: 100% !important; border: none; }
    #player-container { width: 100%; height: 100%; position: relative; }

    /* Error message styling */
    #error-msg {
        display: none;
        color: #fff;
        font-family: 'Poppins', sans-serif;
        font-size: 16px;
        text-align: center;
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.7);
        padding: 20px 30px;
        border-radius: 8px;
        border-left: 4px solid #d80027;
        z-index: 60;
    }

    /* Cosmos Skin Customizations */
    .video-js { font-family: 'Poppins', sans-serif !important; }

    .video-js .vjs-play-progress,
    .video-js .vjs-volume-level {
        background-color: #d80027 !important;
    }

    .video-js .vjs-control-bar {
        background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%) !important;
    }

    .video-js .vjs-big-play-button {
        background-color: rgba(0, 0, 0, 0.5) !important;
        border: 2px solid #d80027 !important;
        border-radius: 50% !important;
        width: 2.5em !important; height: 2.5em !important;
        line-height: 2.3em !important;
        margin-top: -1.25em !important; margin-left: -1.25em !important;
    }

    .video-js:hover .vjs-big-play-button,
    .video-js .vjs-big-play-button:hover,
    .video-js .vjs-big-play-button:focus {
        border-color: #d80027 !important;
        background-color: rgba(216, 0, 39, 0.2) !important;
        outline: none !important;
        transition: all 0.3s ease !important;
    }

    .video-js .vjs-control:hover,
    .video-js .vjs-control:focus {
        color: #d80027 !important;
        outline: none !important;
        text-shadow: 0 0 5px rgba(216, 0, 39, 0.5) !important;
    }

    /* Cosmos Top Bar Overlay */
    .vjs-cosmos-top-bar {
        position: absolute; top: 0; left: 0; width: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        padding: 10px 15px;
        box-sizing: border-box;
        display: flex; justify-content: space-between; align-items: flex-start;
        pointer-events: none; z-index: 10;
        transition: opacity 0.3s ease;
        gap: 15px;
    }

    .vjs-cosmos-title-container {
        border-left: 4px solid #d80027;
        padding-left: 12px;
        flex: 1;
        min-width: 0;
    }

    .vjs-cosmos-title {
        color: #fff;
        font-size: 18px;
        font-weight: 600; margin: 0;
        text-transform: capitalize;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .vjs-cosmos-desc {
        color: #aaa;
        font-size: 12px;
        margin: 2px 0 0 0;
        text-transform: uppercase; letter-spacing: 1px;
    }

    .vjs-cosmos-logo {
        max-height: 30px;
        pointer-events: auto;
        flex-shrink: 0;
    }

    .vjs-user-inactive .vjs-cosmos-top-bar { opacity: 0; }

    /* Iframe wrapper & next-source button */
    .iframe-wrapper {
        position: relative;
        width: 100%; height: 100%;
    }

    #next-source-btn {
        position: absolute;
        bottom: 20px; right: 20px;
        background: #d80027;
        color: #fff;
        border: none;
        padding: 9px 18px;
        border-radius: 5px;
        font-family: 'Poppins', sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 7px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.5);
        transition: background 0.2s ease;
    }
    #next-source-btn:hover { background: #ff0030; }
    #next-source-btn .src-counter {
        background: rgba(0,0,0,0.3);
        border-radius: 3px;
        padding: 1px 6px;
        font-size: 11px;
    }


</style>
</head>
<body>

<div id="player-container">

    <div id="error-msg"></div>
    <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>
    <div id="iframe-container" style="display:none; width:100%; height:100%;"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let iframeSources = [];
let iframeIndex  = 0;

// ── Entry point ───────────────────────────────────────────────────────────────
async function init() {
    const params = new URLSearchParams(window.location.search);
    const id   = params.get('id');
    const type = params.get('type');
    const s    = params.get('s');
    const e    = params.get('e');

    if (!id || !type) {
        showError("Invalid request: missing required parameters.");
        return;
    }

    try {
        const res = await fetch('videos.json');
        if (!res.ok) throw new Error("Database not found");

        const db = await res.json();
        let sources = null;

        if (type === 'movie') {
            sources = db.movies?.[id];
        } else if (type === 'tv') {
            sources = db.tv?.[id]?.[s]?.[e];
        }

        if (!sources || sources.length === 0) {
            showError(type === 'tv'
                ? `Episode S${s}E${e} not found in the database.`
                : `Movie not found in the database.`);
            return;
        }

        hideSpinner();
        setupPlayer(sources, type);

    } catch (err) {
        console.error("Init error:", err);
        showError("System Error: Unable to load video database.");
    }
}

// ── Player router ─────────────────────────────────────────────────────────────
function setupPlayer(sources, type) {
    const firstSource = sources[0];
    const srcType = firstSource.type || detectType(firstSource.src);

    document.getElementById('vjs-player').style.display = 'none';
    document.getElementById('iframe-container').style.display = 'none';

    switch (srcType) {

        // 1. YouTube — IFrame Player API
        case 'youtube': {
            const videoId = extractYouTubeId(firstSource.src);
            if (!videoId) { showError("Invalid YouTube URL."); return; }
            showYouTubePlayer(videoId, type);
            break;
        }

        // 2. HLS — VideoJS handles multi-source fallback natively
        case 'hls':
            showVideoJS(sources, type, 'application/vnd.apple.mpegurl');
            break;

        // 3. Dailymotion
        case 'dailymotion': {
            const builtSources = sources.map(s => {
                let url = s.src.replace(/\/embed\/(?!video\/|playlist\/)/, '/embed/video/');
                url = appendParam(url, 'autoplay', '1');
                return { src: url };
            });
            showIframe(builtSources);
            break;
        }

        // 4. Google Drive
        case 'google-drive': {
            const builtSources = sources.map(s => {
                const match = s.src.match(/\/d\/(.+?)\//);
                return match ? { src: `https://drive.google.com/file/d/${match[1]}/preview` } : null;
            }).filter(Boolean);
            if (!builtSources.length) { showError("Invalid Google Drive URL."); return; }
            showIframe(builtSources);
            break;
        }

        // 5. Mega.nz
        case 'mega': {
            const builtSources = sources.map(s => ({ src: s.src.replace('/file/', '/embed/') }));
            showIframe(builtSources);
            break;
        }

        // 6. Vimeo
        case 'vimeo': {
            const builtSources = sources.map(s => {
                const vid = extractVimeoId(s.src);
                return { src: vid ? `https://player.vimeo.com/video/${vid}?autoplay=1&dnt=1` : s.src };
            });
            showIframe(builtSources);
            break;
        }

        // 7. VK
        case 'vk': {
            const builtSources = sources.map(s => ({ src: appendParam(s.src, 'autoplay', '1') }));
            showIframe(builtSources);
            break;
        }

        // 8. Telegram
        case 'telegram': {
            const builtSources = sources.map(s => {
                let url = appendParam(s.src, 'embed', '1');
                url = appendParam(url, 'autoplay', '1');
                return { src: url };
            });
            showIframe(builtSources);
            break;
        }

        // 9. Facebook
        case 'facebook': {
            const builtSources = sources.map(s => {
                let url = s.src.includes('plugins/video.php')
                    ? s.src
                    : `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(s.src)}&show_text=false`;
                url = appendParam(url, 'autoplay', '1');
                return { src: url };
            });
            showIframe(builtSources);
            break;
        }

        // 10. Generic iframe — pass URLs through untouched
        case 'iframe':
            showIframe(sources.map(s => ({ src: s.src })));
            break;

        // 11. Default: VideoJS for MP4 (multi-source fallback built-in)
        default:
            if (firstSource.src.includes('.m3u8')) {
                showVideoJS(sources, type, 'application/vnd.apple.mpegurl');
            } else {
                showVideoJS(sources, type);
            }
            break;
    }
}

// ── VideoJS player ────────────────────────────────────────────────────────────
function showVideoJS(sources, type = 'movie') {
    const playerContainer = document.getElementById('player-container');
    const typeLabel = type === 'tv' ? 'TV SHOW' : 'MOVIE';

    const fullUrl = sources[0].src;
    const fileName = fullUrl.substring(fullUrl.lastIndexOf('/') + 1).split('?')[0].split('.')[0];
    const displayTitle = decodeURIComponent(fileName).replace(/[-_]/g, ' ');

    if (videojs.getPlayers()['vjs-player']) {
        videojs('vjs-player').dispose();
        playerContainer.innerHTML = '<video id="vjs-player" class="video-js vjs-big-play-centered"></video>';
    }

    const el = document.getElementById('vjs-player');
    el.style.display = 'block';

    const isHLS = sources[0].type === 'hls' || sources[0].src.includes('.m3u8');

    const playerOptions = {
        controls: true,
        autoplay: false,
        fill: true,
        // VideoJS tries each source in order — built-in multi-source fallback
        sources: sources.map(s => ({
            src: s.src,
            type: (s.type === 'hls' || s.src.includes('.m3u8'))
                ? 'application/vnd.apple.mpegurl'
                : 'video/mp4',
            label: s.label || undefined
        })),
        plugins: {}
    };

    if (!isHLS) {
        playerOptions.plugins.vjsdownload = {
            beforeElement: 'fullscreenToggle',
            textControl: 'Download Video',
            name: 'downloadButton',
            downloadURL: sources[0].src
        };
    }

    const player = videojs('vjs-player', playerOptions);

    if (isHLS) {
        player.ready(function () { player.httpSourceSelector(); });
    }

    player.ready(function () {
        const playerEl = player.el();
        const topBar = document.createElement('div');
        topBar.className = 'vjs-cosmos-top-bar';
        topBar.innerHTML = `
            <div class="vjs-cosmos-title-container">
                <h1 class="vjs-cosmos-title">${displayTitle}</h1>
                <p class="vjs-cosmos-desc">${typeLabel}</p>
            </div>
            <img class="vjs-cosmos-logo"
                src="../Attachments/Chithruka%20Streamer%20Logo.svg"
                oncontextmenu="return false;"
                ondragstart="return false;"
                onselectstart="return false;"
                alt="Logo">
        `;
        playerEl.appendChild(topBar);
    });
}

// ── Iframe player with multi-source fallback ──────────────────────────────────
function showIframe(sources) {
    iframeSources = sources;
    iframeIndex   = 0;
    renderIframe();
}

function renderIframe() {
    const container = document.getElementById('iframe-container');
    container.style.display = 'block';

    const hasMore = iframeSources.length > 1;
    const current = iframeIndex + 1;
    const total   = iframeSources.length;

    // Use DOM assignment for src to avoid injection risk
    const wrapper = document.createElement('div');
    wrapper.className = 'iframe-wrapper';

    const iframe = document.createElement('iframe');
    iframe.src = iframeSources[iframeIndex].src;
    iframe.className = 'external-iframe';
    iframe.setAttribute('allow', 'autoplay *; fullscreen *; picture-in-picture *; encrypted-media *');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('frameborder', '0');
    iframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

    wrapper.appendChild(iframe);

    // Show "Try Next Source" button only when multiple sources exist
    if (hasMore) {
        const btn = document.createElement('button');
        btn.id = 'next-source-btn';
        btn.innerHTML = `
            ▶ Try Next Source
            <span class="src-counter">${current} / ${total}</span>
        `;
        btn.onclick = nextIframeSource;
        wrapper.appendChild(btn);
    }

    container.innerHTML = '';
    container.appendChild(wrapper);
}

function nextIframeSource() {
    iframeIndex++;
    if (iframeIndex < iframeSources.length) {
        renderIframe();
    } else {
        showError("No more sources available.");
    }
}

// ── YouTube IFrame Player API ─────────────────────────────────────────────────
// API key stored as base64 to avoid plain-text exposure
const _yk = atob('QUl6YVN5QXhpSmlrYWJQQTJ2ZVp3UjJTT1FNUHRYMG1peVpJSC1B');

let _ytPlayer = null;
let _ytReady  = false;
const _ytQueue = [];

// Inject the YouTube IFrame API script once
(function loadYTApi() {
    if (document.getElementById('yt-iframe-api')) return;
    const tag = document.createElement('script');
    tag.id  = 'yt-iframe-api';
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
})();

// Called automatically by the YouTube API once loaded
window.onYouTubeIframeAPIReady = function () {
    _ytReady = true;
    if (_ytQueue.length) {
        const { videoId, type } = _ytQueue.shift();
        _createYTPlayer(videoId, type);
    }
};

function showYouTubePlayer(videoId, type) {
    // Hide the VideoJS player and any existing iframes
    document.getElementById('vjs-player').style.display = 'none';
    document.getElementById('iframe-container').style.display = 'none';

    const playerContainer = document.getElementById('player-container');

    // Remove previous YouTube player wrapper if present
    const old = document.getElementById('yt-player-wrap');
    if (old) old.remove();
    if (_ytPlayer) { try { _ytPlayer.destroy(); } catch(e){} _ytPlayer = null; }

    // Build a wrapper that fills the container
    const wrap = document.createElement('div');
    wrap.id = 'yt-player-wrap';
    wrap.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:#000;z-index:5;';

    const mountEl = document.createElement('div');
    mountEl.id = 'yt-mount';
    wrap.appendChild(mountEl);
    playerContainer.appendChild(wrap);

    if (_ytReady) {
        _createYTPlayer(videoId, type);
    } else {
        _ytQueue.push({ videoId, type });
    }
}

function _createYTPlayer(videoId, type) {
    _ytPlayer = new YT.Player('yt-mount', {
        videoId: videoId,
        playerVars: {
            autoplay:        1,
            rel:             0,
            modestbranding:  1,
            controls:        1,
            playsinline:     1,
            // API key used server-side by YouTube; decoded at runtime
            key: _yk
        },
        width:  '100%',
        height: '100%',
        events: {
            onReady: function (e) { e.target.playVideo(); },
            onError: function (e) { showError('YouTube playback error: ' + e.data); }
        }
    });

    // Make the iframe fill its container
    const ytIframe = document.getElementById('yt-mount');
    if (ytIframe) {
        ytIframe.style.cssText = 'width:100%;height:100%;';
    }
}

// ── Utility helpers ───────────────────────────────────────────────────────────

function detectType(src) {
    if (!src) return 'mp4';
    if (src.includes('.m3u8'))                              return 'hls';
    if (src.includes('youtube.com') || src.includes('youtu.be')) return 'youtube';
    if (src.includes('vimeo.com'))                          return 'vimeo';
    if (src.includes('dailymotion.com'))                    return 'dailymotion';
    if (src.includes('drive.google.com'))                   return 'google-drive';
    if (src.includes('mega.nz'))                            return 'mega';
    if (src.includes('vk.com'))                             return 'vk';
    if (src.includes('t.me') || src.includes('telegram'))  return 'telegram';
    if (src.includes('facebook.com'))                       return 'facebook';
    return 'mp4';
}

function appendParam(url, key, value) {
    if (url.includes(`${key}=`)) return url;
    return url + (url.includes('?') ? '&' : '?') + `${key}=${value}`;
}

function extractYouTubeId(url) {
    const match = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]{11})/);
    return match ? match[1] : null;
}

function extractVimeoId(url) {
    const match = url.match(/vimeo\.com\/(?:video\/|channels\/(?:\w+\/)?|groups\/(?:[^\/]+)\/videos\/)?(\d+)/);
    return match ? match[1] : null;
}

function hideSpinner() { /* no-op */ }

function showError(msg) {
    const el = document.getElementById('error-msg');
    el.innerText = msg;
    el.style.display = 'block';
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
