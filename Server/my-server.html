<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chithruka Server</title>
    <link href="https://unpkg.com/video.js@7/dist/video-js.min.css" rel="stylesheet">
    <script src="https://unpkg.com/video.js@7/dist/video.min.js"></script>

    <script src="https://unpkg.com/videojs-contrib-quality-levels@2.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
    <script src="https://unpkg.com/videojs-http-source-selector@1.1.6/dist/videojs-http-source-selector.min.js"></script>

    <link href="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.css" rel="stylesheet">
    <script src="https://unpkg.com/videojs-vjsdownload/dist/videojs-vjsdownload.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    .video-js, .external-iframe { width: 100% !important; height: 100% !important; border: none; }
    #player-container { width: 100%; height: 100%; position: relative; }
    
    /* Cosmos Skin Customizations */
    .video-js { font-family: 'Poppins', sans-serif !important; }

    /* Red Accent Colors */
    .video-js .vjs-play-progress, 
    .video-js .vjs-volume-level {
        background-color: #d80027 !important;
    }

    /* Control Bar Gradient - Standard Alignment */
    .video-js .vjs-control-bar {
        background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%) !important;
        /* We remove 'display: flex' and 'align-items: center' here to let 
           Video.js use its default positioning for the seekbar */
    }

    /* Red Accent Colors (Keep these) */
    .video-js .vjs-play-progress, 
    .video-js .vjs-volume-level {
        background-color: #d80027 !important;
    }

    /* Center Play Button Styling */
    .video-js .vjs-big-play-button {
        background-color: rgba(0, 0, 0, 0.5) !important;
        border: 2px solid #d80027 !important;
        border-radius: 50% !important;
        width: 2.5em !important; height: 2.5em !important;
        line-height: 2.3em !important;
        margin-top: -1.25em !important; margin-left: -1.25em !important;
    }
    /* Fix hover and focus states for the Big Play Button */
    .video-js:hover .vjs-big-play-button,
    .video-js .vjs-big-play-button:hover,
    .video-js .vjs-big-play-button:focus {
        border-color: #d80027 !important;
        background-color: rgba(216, 0, 39, 0.2) !important; /* Adds a subtle red tint on hover */
        outline: none !important; /* Strips away the browser's default yellow/blue focus ring */
        transition: all 0.3s ease !important;
    }

    /* Fix hover and focus states for the bottom control bar buttons */
    .video-js .vjs-control:hover,
    .video-js .vjs-control:focus {
        color: #d80027 !important;
        outline: none !important;
        text-shadow: 0 0 5px rgba(216, 0, 39, 0.5) !important; /* Optional: adds a slight red glow */
    }
    
        /* Cosmos Top Bar Overlay */
    .vjs-cosmos-top-bar {
        position: absolute; top: 0; left: 0; width: 100%;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        /* Reduced padding to push elements closer to the very top corners */
        padding: 10px 15px; 
        box-sizing: border-box;
        display: flex; justify-content: space-between; align-items: flex-start;
        pointer-events: none; z-index: 10;
        transition: opacity 0.3s ease;
        gap: 15px; /* Ensures a minimum gap between the title and logo */
    }

    .vjs-cosmos-title-container {
        border-left: 4px solid #d80027;
        padding-left: 12px;
        flex: 1; /* Allows the title to take available space but no more */
        min-width: 0; /* Crucial: Prevents a long title from blowing out the flex layout */
    }

    .vjs-cosmos-title { 
        color: #fff; 
        font-size: 18px; /* Reduced from 24px */
        font-weight: 600; margin: 0; 
        text-transform: capitalize; 
        /* The next 3 lines prevent long titles from pushing the logo out */
        white-space: nowrap; 
        overflow: hidden; 
        text-overflow: ellipsis; 
    }
    
    .vjs-cosmos-desc { 
        color: #aaa; 
        font-size: 12px; /* Reduced from 14px */
        margin: 2px 0 0 0; 
        text-transform: uppercase; letter-spacing: 1px;
    }
    
    .vjs-cosmos-logo { 
        max-height: 30px; /* Reduced from 45px */
        pointer-events: auto; 
        flex-shrink: 0; /* Prevents the logo from ever shrinking when the title is long */
    }

    /* Hide top bar when player is inactive */
    .vjs-user-inactive .vjs-cosmos-top-bar { opacity: 0; }

</style>
</head>
<body>

    <div id="player-container">
        <div id="error-msg">Checking source...</div>
        <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>
        <div id="iframe-container" style="display:none; width:100%; height:100%;"></div>
    </div>

<script>
async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const type = params.get('type');
    const s = params.get('s');
    const e = params.get('e');
    const errorEl = document.getElementById('error-msg');

    try {
        const res = await fetch('videos.json');
        if (!res.ok) throw new Error("Database not found");
        const db = await res.json();

        let sources = null;
        let nameFromJson = null;
        let posterFromJson = null;

        // 1. DATA EXTRACTION LOGIC
        if (type === 'movie') {
            const movieData = db.movies[id];
            if (Array.isArray(movieData)) {
                // Support for OLD format: "id": [{...}]
                sources = movieData;
            } else if (movieData && movieData.sources) {
                // Support for NEW format: "id": { "name": "...", "poster": "...", "sources": [...] }
                sources = movieData.sources;
                nameFromJson = movieData.name;
                posterFromJson = movieData.poster;
            }
        } else if (type === 'tv') {
            const epData = db.tv && db.tv[id] && db.tv[id][s] && db.tv[id][s][e];
            if (Array.isArray(epData)) {
                // Support for OLD TV format (Direct array)
                sources = epData;
            } else if (epData && epData.sources) {
                // Support for NEW TV format (Object with poster/name)
                sources = epData.sources;
                nameFromJson = epData.name;
                posterFromJson = epData.poster;
            }
        }

        // 2. VALIDATION
        if (!sources || sources.length === 0) {
            errorEl.innerText = type === 'tv' ? `Episode S${s}:E${e} not found.` : "Movie not found.";
            return;
        }

        errorEl.style.display = 'none';
        const primarySource = sources[0];

        // 3. ROUTING
        if (['mp4', 'hls', 'google-drive', 'direct', 'youtube'].includes(primarySource.type)) {
            showVideoJS(sources, nameFromJson, posterFromJson);
        } else {
            showIframe(primarySource.src);
        }

    } catch (err) {
        errorEl.innerText = "Error loading video data.";
        console.error(err);
    }
}

function showVideoJS(sources, nameFromJson, posterFromJson, mimeType = 'video/mp4') {
    const playerContainer = document.getElementById('player-container');
    const params = new URLSearchParams(window.location.search);
    
    const type = params.get('type');
    const eParam = params.get('e'); 
    const typeLabel = type === 'tv' ? 'TV SHOW' : 'MOVIE';
    
    // 4. TITLE SELECTION LOGIC
    let displayTitle = "";
    if (type === 'tv' && eParam) {
        // For TV shows, prioritize the stable "Episode X" label
        displayTitle = `Episode ${eParam}`;
    } else if (nameFromJson) {
        // For Movies, use the name from JSON if provided
        displayTitle = nameFromJson;
    } else {
        // Fallback to filename extraction
        const fullUrl = sources[0].src;
        const fileName = fullUrl.substring(fullUrl.lastIndexOf('/') + 1).split(/[?#]/)[0].split('.')[0];
        displayTitle = decodeURIComponent(fileName).replace(/[-_.]/g, ' ');
    }

    // Clean up existing player
    if (videojs.getPlayers()['vjs-player']) {
        videojs('vjs-player').dispose();
        playerContainer.innerHTML = '<video id="vjs-player" class="video-js vjs-big-play-centered"></video>';
    }

    const el = document.getElementById('vjs-player');
    el.style.display = 'block';

    const isHLS = sources[0].type === 'hls';
    
    // 5. PLAYER CONFIGURATION
    const playerOptions = {
        autoplay: false,
        controls: true,
        responsive: true,
        fluid: true,
        preload: 'auto',
        poster: posterFromJson || '', // Set the poster image here
        sources: sources.map(s => ({
            src: s.src,
            type: s.type === 'hls' ? 'application/x-mpegURL' : mimeType,
            label: s.label || 'Default'
        })),
        plugins: {} 
    };

    if (!isHLS) {
        playerOptions.plugins.vjsdownload = {
            beforeElement: 'fullscreenToggle',
            textControl: 'Download Video',
            name: 'downloadButton',
            downloadURL: sources[0].src
        };
    }

    const player = videojs('vjs-player', playerOptions);

    if (isHLS) {
        player.ready(function() {
            player.httpSourceSelector();
        });
    }

    // 6. TOP BAR OVERLAY
    player.ready(function() {
        const playerEl = player.el();
        const topBar = document.createElement('div');
        topBar.className = 'vjs-cosmos-top-bar';
        topBar.innerHTML = `
            <div class="vjs-cosmos-title-container">
                <h1 class="vjs-cosmos-title">${displayTitle}</h1>
                <p class="vjs-cosmos-desc">${typeLabel}</p>
            </div>
            <img class="vjs-cosmos-logo" src="../Attachments/Chithruka%20Streamer%20Logo.svg" alt="Logo">
        `;
        playerEl.appendChild(topBar);
    });
}

function showIframe(url) {
    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = `<iframe src="${url}" class="external-iframe" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

init();
</script>

</body>
</html>
