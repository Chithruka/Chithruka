<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Source Server</title>
   <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Videojs-YouTube.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .video-js, .external-iframe { width: 100% !important; height: 100% !important; border: none; }
        #player-container { width: 100%; height: 100%; position: relative; }
        #error-msg { 
            color: white; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            display: none; font-family: sans-serif; z-index: 10;
        }
        /* This "crops" the top of the YouTube iframe where the title and icon live */
.vjs-youtube .vjs-tech {
    position: absolute;
    top: -60px; /* Moves the title bar off-screen */
    height: calc(100% + 120px) !important; /* Stretches the video to fill the gap */
}

    </style>
</head>
<body>

    <div id="player-container">
        <div id="error-msg">Checking source...</div>
        <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>
        <div id="iframe-container" style="display:none; width:100%; height:100%;"></div>
    </div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const type = params.get('type');
    const s = params.get('s'); 
    const e = params.get('e'); 
    const errorEl = document.getElementById('error-msg');

    try {
        const res = await fetch('videos.json');
        if (!res.ok) throw new Error("Database not found");
        
        const db = await res.json();
        let sources = null;

        if (type === 'movie') {
            sources = db.movies[id];
        } else if (type === 'tv') {
            // Validating path exists in your merged JSON
            if (db.tv && db.tv[id] && db.tv[id][s] && db.tv[id][s][e]) {
                sources = db.tv[id][s][e];
            }
        }

        if (!sources || sources.length === 0) {
            errorEl.innerText = type === 'tv' ? `Episode S${s}:E${e} not found.` : "Movie not found.";
            errorEl.style.display = 'block';
            return;
        }

        setupPlayer(sources);

    } catch (err) {
        errorEl.innerText = "System Error: Unable to load video database.";
        errorEl.style.display = 'block';
    }
}

function setupPlayer(sources) {
    const firstSource = sources[0];

    // Reset UI to hide previous players or error messages
    document.getElementById('vjs-player').style.display = 'none';
    document.getElementById('iframe-container').style.display = 'none';

    // 1. Handle Telegram Embeds
    if (firstSource.type === 'telegram') {
        const telId = firstSource.src.split('t.me/')[1];
        showIframe(`https://t.me/${telId}?embed=1`);
    } 
    // 2. Handle YouTube via Video.js
    else if (firstSource.type === 'youtube') {
        showVideoJS(sources, 'video/youtube');
    } 
    // 3. NEW: Handle HLS (.m3u8) Streams
    else if (firstSource.type === 'hls' || firstSource.src.includes('.m3u8')) {
        showVideoJS(sources, 'application/x-mpegURL');
    }
    // 4. Handle Dailymotion Embeds
    else if (firstSource.type === 'dailymotion') {
        const videoId = firstSource.src.split('/').pop();
        showIframe(`https://www.dailymotion.com/embed/video/${videoId}`);
    }
    // 5. Handle Google Drive Preview
    else if (firstSource.type === 'google-drive') {
        const videoId = firstSource.src.match(/\/d\/(.+?)\//)[1];
        showIframe(`https://drive.google.com/file/d/${videoId}/preview`);
    }
    // 6. Handle Facebook Video Plugin
    else if (firstSource.type === 'facebook') {
        const encodedUrl = encodeURIComponent(firstSource.src);
        const fbEmbed = `https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=0&width=560`;
        showIframe(fbEmbed);
    }
    // 7. Handle Mega.nz Embeds
    else if (firstSource.type === 'mega') {
        const megaEmbed = firstSource.src.replace('/file/', '/embed/');
        showIframe(megaEmbed);
    }
    // 8. Default to VideoJS for direct MP4/MKV links
    else {
        showVideoJS(sources);
    }
}

function showVideoJS(sources, mimeType = 'video/mp4') {
    const playerContainer = document.getElementById('player-container');
    
    if (videojs.getPlayers()['vjs-player']) {
        videojs('vjs-player').dispose();
        playerContainer.innerHTML = '<video id="vjs-player" class="video-js vjs-big-play-centered"></video>';
    }

    const el = document.getElementById('vjs-player');
    el.style.display = 'block';

    const player = videojs('vjs-player', {
        controls: true,
        autoplay: false,
        preload: 'auto',
        fluid: true,
        techOrder: ["html5", "youtube"], 
        sources: sources.map(s => {
            // Determine the correct type for each source
            let type = 'video/mp4'; // default
            if (s.type === 'youtube') type = 'video/youtube';
            else if (s.type === 'hls' || s.src.includes('.m3u8')) type = 'application/x-mpegURL';
            
            return { src: s.src, type: type };
        }),
        youtube: { 
            iv_load_policy: 3,
            modestbranding: 1,
            rel: 0,
            showinfo: 0,
            noCookie: true
        }
    });
}


function showIframe(url) {
    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = `<iframe 
        src="${url}" 
        class="external-iframe" 
allow="autoplay *; encrypted-media *; fullscreen *; picture-in-picture *"
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true" 
        frameborder="0"></iframe>`;
}

init();
</script>
</body>
</html>
