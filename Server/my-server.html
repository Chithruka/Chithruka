<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Source Server</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .video-js, .external-iframe { width: 100% !important; height: 100% !important; border: none; }
        #player-container { width: 100%; height: 100%; position: relative; }
        #error-msg { 
            color: white; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            display: none; font-family: sans-serif; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="error-msg">Checking source...</div>
        <video id="vjs-player" class="video-js vjs-big-play-centered" style="display:none;"></video>
        <div id="iframe-container" style="display:none; width:100%; height:100%;"></div>
    </div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<script>
async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const type = params.get('type');
    const s = params.get('s'); 
    const e = params.get('e'); 
    const errorEl = document.getElementById('error-msg');

    try {
        const res = await fetch('videos.json');
        if (!res.ok) throw new Error("Database not found");
        
        const db = await res.json();
        let sources = null;

        if (type === 'movie') {
            sources = db.movies[id];
        } else if (type === 'tv') {
            // Validating path exists in your merged JSON
            if (db.tv && db.tv[id] && db.tv[id][s] && db.tv[id][s][e]) {
                sources = db.tv[id][s][e];
            }
        }

        if (!sources || sources.length === 0) {
            errorEl.innerText = type === 'tv' ? `Episode S${s}:E${e} not found.` : "Movie not found.";
            errorEl.style.display = 'block';
            return;
        }

        setupPlayer(sources);

    } catch (err) {
        errorEl.innerText = "System Error: Unable to load video database.";
        errorEl.style.display = 'block';
    }
}

function setupPlayer(sources) {
    const firstSource = sources[0];

    // Reset UI
    document.getElementById('vjs-player').style.display = 'none';
    document.getElementById('iframe-container').style.display = 'none';

    if (firstSource.type === 'telegram') {
        const telId = firstSource.src.split('t.me/')[1];
        showIframe(`https://t.me/${telId}?embed=1`);
    } 
    else if (firstSource.type === 'youtube') {
        const videoId = firstSource.src.split('v=')[1]?.split('&')[0];
        showIframe(`https://www.youtube.com/embed/${videoId}?autoplay=0&rel=0`);
    } 
    else if (firstSource.type === 'dailymotion') {
        const videoId = firstSource.src.split('/').pop();
        showIframe(`https://www.dailymotion.com/embed/video/${videoId}`);
    }
    else if (firstSource.type === 'google-drive') {
        const videoId = firstSource.src.match(/\/d\/(.+?)\//)[1];
        showIframe(`https://drive.google.com/file/d/${videoId}/preview`);
    }
    /* --- NEW FACEBOOK LOGIC --- */
    else if (firstSource.type === 'facebook') {
        // Facebook requires the full URL to be encoded as a parameter
        const encodedUrl = encodeURIComponent(firstSource.src);
        const fbEmbed = `https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=0&width=560`;
        showIframe(fbEmbed);
    }
    /* -------------------------- */
    else {
        showVideoJS(sources);
    }
}


function showVideoJS(sources) {
    const el = document.getElementById('vjs-player');
    const errorEl = document.getElementById('error-msg');
    el.style.display = 'block';

    const player = videojs('vjs-player', {
        controls: true,
        fluid: true,
        sources: sources.map(s => ({
            src: s.src,
            type: 'video/mp4',
            label: s.label
        }))
    });

    player.on('error', () => {
        el.style.display = 'none';
        errorEl.innerText = "The video file is unavailable or broken.";
        errorEl.style.display = 'block';
    });
}

function showIframe(url) {
    const container = document.getElementById('iframe-container');
    container.style.display = 'block';
    container.innerHTML = `<iframe 
        src="${url}" 
        class="external-iframe" 
        allow="autoplay; fullscreen; picture-in-picture" 
        allowfullscreen></iframe>`;
}

init();
</script>
</body>
</html>
