     :root {

}

        /* --- Global Reset --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-black); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-red); }

        body {

        /* --- Video.js Theme Overrides --- */

        /* --- Header & Navigation --- */
        header {
            position: fixed; top: 0; width: 100%; height: 70px;

        header.scrolled { background-color: var(--bg-black); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

        .logo {
            font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem;

            text-decoration: none; transition: color 0.3s;
        }
        .nav-links a:hover { color: white; }

        /* Mobile Menu */
        /* Mobile Menu Overlay - FIXED Z-INDEX */
#mobile-menu-overlay {
    position: fixed; 
    top: 70px; 
    left: 0; 
    right: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    padding: 20px;
    display: none; 
    flex-direction: column; 
    gap: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    animation: slideDown 0.3s ease-out;
    z-index: 1001; /* This must be higher than the header (1000) */
}
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        #mobile-menu-overlay a {
            font-size: 1.1rem; color: white; padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* --- Search & Avatar --- */
        .search-box {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);

        }

        .infinite-grid {

.poster-fallback {

        // --- Core Functions ---
        function resetPage(e) {
            if(e) e.preventDefault();
            document.getElementById('search-input').value = '';
            filteredChannels = [...allChannels];
            displayedCount = CHANNELS_PER_PAGE;
            renderGrid(filteredChannels.slice(0, CHANNELS_PER_PAGE), true);
            document.getElementById('load-more-container').style.display = filteredChannels.length > CHANNELS_PER_PAGE ? 'flex' : 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu-overlay');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleImageError(img) {
            const poster = img.parentElement;
            const fallback = poster.querySelector('.poster-fallback');
            img.style.display = 'none';
            if(fallback) fallback.style.display = 'flex';
        }

        // --- Fast Render Grid utilizing Document Fragment ---
        function renderGrid(channels, clear = false) {
            const container = document.getElementById('main-content');
            if (clear) container.innerHTML = '<div id="infinite-grid" class="infinite-grid"></div>';
            
            const grid = document.getElementById('infinite-grid');
            if(!grid) return;

            const fragment = document.createDocumentFragment(); 

            channels.forEach(channel => {
                const poster = document.createElement('div');
                poster.className = 'poster';
                poster.onclick = () => openPlayer(channel);

                const logoSrc = channel.logo || "";
                let badge = channel.isPremium ? '<span class="premium-badge">With Ads</span>' : '';
                
                poster.innerHTML = `
                    ${badge}
                    <img src="${logoSrc}" loading="lazy" style="${!logoSrc ? 'display:none' : ''}" onerror="handleImageError(this)">
                    <div class="poster-fallback" style="${logoSrc ? 'display:none' : 'display:flex'}">
                        <i class="fa-solid fa-tv"></i>
                    </div>
                    <div class="poster-overlay">
                        <div class="poster-title truncate w-full text-white drop-shadow-md">${channel.name}</div>
                    </div>
                `;
                fragment.appendChild(poster);
            });
            
            grid.appendChild(fragment);
        }

        // --- Search ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            filteredChannels = allChannels.filter(c => c.name.toLowerCase().includes(query));
            displayedCount = CHANNELS_PER_PAGE; 
            renderGrid(filteredChannels.slice(0, CHANNELS_PER_PAGE), true);
            document.getElementById('load-more-container').style.display = filteredChannels.length > CHANNELS_PER_PAGE ? 'flex' : 'none';
        });

        // --- Player ---
        async function showMoreInfo(channelName) {
            const modal = document.getElementById('info-modal');
            const overlay = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            modal.style.display = 'block';
            overlay.style.display = 'block';
            title.innerText = channelName;
            content.innerHTML = '<div class="animate-pulse">Searching global cricket database...</div>';

            const searchTerms = [channelName, "Cricket"];

            for (let term of searchTerms) {
                try {
                    const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/search_all_leagues.php?s=Cricket`);
                    const data = await response.json();
                    const league = data.countrys ? data.countrys[0] : null;

                    if (league) {
                        content.innerHTML = `
                            <div class="mb-4 text-center">
                                <img src="${league.strBadge}" class="w-24 h-24 mb-4 mx-auto" onerror="this.src='https://www.thesportsdb.com/images/media/league/badge/0787tt1521124451.png'">
                                <p class="font-bold text-white mb-2">Tournament/League Info:</p>
                                <p class="text-sm leading-relaxed">${league.strDescriptionEN ? league.strDescriptionEN.substring(0, 400) + '...' : 'Live cricket coverage including T20, ODI, and Test matches.'}</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-sm mt-4">
                                <div class="bg-zinc-800 p-2 rounded border border-zinc-700"><strong>Sport:</strong> ${league.strSport || 'Cricket'}</div>
                                <div class="bg-zinc-800 p-2 rounded border border-zinc-700"><strong>First Played:</strong> ${league.intFormedYear || 'N/A'}</div>
                            </div>
                        `;
                        return;
                    }
                } catch (error) {
                    console.error("Cricket API Error:", error);
                }
            }
            content.innerHTML = `<p>Specific details for "${channelName}" aren't in the database yet. This channel features live cricket broadcasts and regional matches.</p>`;
        }

        function closeInfo() {
            document.getElementById('info-modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function openPlayer(channel) {
            const overlay = document.getElementById('player-overlay');
            const title = document.getElementById('player-title');
            const vidContainer = document.getElementById('video-container');

            overlay.style.display = 'flex';
            title.innerText = channel.name;
            vidContainer.innerHTML = '';

            if (channel.type === 'iframe') {
                const iframe = document.createElement('iframe');
                iframe.src = channel.src;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = 'none';
                iframe.style.backgroundColor = "black";
                iframe.allowFullscreen = true;
                iframe.allow = "autoplay; encrypted-media"; 
                vidContainer.appendChild(iframe);
            } else if (channel.type === 'hls') {
                const videoHtml = `
                    <video id="main-player" 
                           class="video-js vjs-theme-netflix vjs-big-play-centered" 
                           controls 
                           preload="auto" 
                           poster="data:image/gif;base64,R0lGODlhAQABAIAAAAUEBAAAACwAAAAAAQABAAACAkQBADs=">
                        <source src="${channel.url}" type="application/x-mpegURL">
                    </video>
                `;
                vidContainer.innerHTML = videoHtml;

                if (typeof videojs !== 'undefined') {
                    player = videojs('main-player', { fill: true, autoplay: true, responsive: true });
                    player.on('loadstart', function() { this.addClass('vjs-custom-loading'); });
                    player.on('playing', function() { this.removeClass('vjs-custom-loading'); });
                } else {
                    console.error("Video.js is not loaded yet.");
                }
            }
        }

        function loadMoreChannels() {
            const nextBatch = filteredChannels.slice(displayedCount, displayedCount + CHANNELS_PER_PAGE);
            renderGrid(nextBatch, false); 
            displayedCount += CHANNELS_PER_PAGE;

            if (displayedCount >= filteredChannels.length) {
                document.getElementById('load-more-container').style.display = 'none';
            }
        }

        function closePlayer() {
            const overlay = document.getElementById('player-overlay');
            const vidContainer = document.getElementById('video-container');

            overlay.style.display = 'none';
            if (player) {
                try { player.pause(); player.dispose(); } catch(e) { console.log(e); }
                player = null;
            }
            vidContainer.innerHTML = '';
        }

        function playRandom() {
            if(allChannels.length > 0) {
                const random = allChannels[Math.floor(Math.random() * allChannels.length)];
                openPlayer(random);
            }
        }

        // --- Initialization & Background Fetch ---

        // 1. INSTANT RENDER: Load premium channels immediately
        allChannels = [...premiumChannels];
        filteredChannels = [...allChannels];
        displayedCount = CHANNELS_PER_PAGE;
        renderGrid(filteredChannels.slice(0, CHANNELS_PER_PAGE), true);
        document.getElementById('load-more-container').style.display = filteredChannels.length > CHANNELS_PER_PAGE ? 'flex' : 'none';

        // 2. BACKGROUND FETCH: Get the M3U file without freezing the UI
        async function fetchChannels() {
            try {
                const response = await fetch(M3U_URL);
                const text = await response.text();
                
                setTimeout(() => {
                    const lines = text.split('\n');
                    let current = {};
                    const newApiChannels = [];
                    
                    for (let i = 0; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if (line.startsWith('#EXTINF')) {
                            const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                            const name = line.split(',').pop();
                            current = { name, logo: logoMatch ? logoMatch[1] : '', type: 'hls' };
                        } else if (line.startsWith('http')) {
                            current.url = line;
                            if (current.url.includes('.m3u8')) newApiChannels.push(current);
                        }
                    }
                    
                    apiChannels = newApiChannels;
                    allChannels = [...premiumChannels, ...apiChannels];
                    
                    if (document.getElementById('search-input').value === '') {
                        filteredChannels = [...allChannels];
                        document.getElementById('load-more-container').style.display = filteredChannels.length > displayedCount ? 'flex' : 'none';
                    }
                }, 100); 
            } catch (e) { 
                console.error("M3U Fetch Error:", e); 
            }
        }

        fetchChannels();
    </script>

</body>
</html>
