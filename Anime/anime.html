<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chithruka Anime</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../output.css">
    </head>
<body>
<div id="page-background"></div>
<div class="container mx-auto px-4">
    <nav class="navbar">
        <img src="../Attachments/Chithruka%20Streamer%20Logo.svg" alt="Logo" class="logo-img" onclick="location.href='anime.html';">
        <div class="search-group">
            <div class="relative w-full max-w-[300px] flex-grow">
                <input type="text" id="search-input" class="glass-input" placeholder="Search Anime...">
                <i class="fas fa-search absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm pointer-events-none"></i>
                <ul id="search-results" class="glass-panel hidden"></ul>
            </div>
        </div>
    </nav>

    <div id="hero-section">
        <div id="hero-slides"></div>
        <div id="hero-indicators" class="hero-indicators"></div>
    </div>
<div class="mb-12 relative" id="trending-section">
        <h2 class="text-xl md:text-2xl font-bold mb-6 text-white flex items-center px-2 section-title border-l-4 border-[#e50914] pl-3">
            Trending Anime
        </h2>
        <div class="relative group px-2">
            <button class="scroll-btn left-0 -ml-4" onclick="scrollContainer('trending-container', -300)">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div id="trending-container" class="flex flex-nowrap gap-4 md:gap-5 overflow-x-auto pb-8 scrollbar-hide scroll-smooth py-4"></div>
            
            <button class="scroll-btn right-0 -mr-4" onclick="scrollContainer('trending-container', 300)">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div> <div id="details-section" class="glass-panel p-6 md:p-8 rounded-2xl hidden mb-8 mt-8">
        <div class="flex flex-col md:flex-row gap-8 md:items-start">
            
            <div class="flex-shrink-0 mx-auto md:mx-0 w-48 md:w-52 detail-poster-wrapper rounded-xl overflow-hidden shadow-2xl border border-gray-700">
                <img id="detail-poster" src="" alt="Poster" class="w-full h-full object-cover" loading="lazy">
            </div>
            
            <div class="flex-grow min-w-0">
                <h2 id="detail-heading" class="text-3xl md:text-4xl font-bold mb-1 text-white"></h2>
                
                <div class="flex flex-wrap items-center gap-4 md:gap-5 text-sm text-gray-300 mb-6 mt-4">
                    <span id="detail-date" class="flex items-center"><i class="far fa-calendar-alt mr-2 text-accent"></i> <span></span></span>
                    <span id="detail-rating" class="flex items-center"><i class="fas fa-star text-yellow-500 mr-2"></i> <span></span></span>
                    <span id="detail-runtime" class="flex items-center"><i class="far fa-clock mr-2"></i> <span></span></span>
                    <span id="detail-status" class="flex items-center text-green-400 font-semibold"><i class="fas fa-info-circle mr-2"></i><span></span></span>
                    <span id="detail-episodes" class="flex items-center text-blue-400 font-semibold"><i class="fas fa-layer-group mr-2"></i><span></span></span>
                </div>

                <div id="detail-genres" class="flex flex-wrap gap-2 mb-6"></div>
                <p id="detail-overview" class="text-gray-300 leading-relaxed text-sm md:text-base mb-6"></p>
                
                <div id="player-interface" class="hidden fade-in">
                    <div class="mb-6 rounded-xl overflow-hidden shadow-2xl relative bg-black border border-gray-800">
                        <iframe id="player-iframe" src="" frameborder="0" allowfullscreen class="w-full aspect-video rounded-xl shadow-2xl"></iframe>
                    </div>

                    <div class="glass-panel p-4 rounded-xl mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex gap-2 items-center">
                            <span class="text-sm font-bold text-gray-400 mr-2">Audio:</span>
                            <div id="server-buttons" class="flex flex-wrap gap-2">
                                <button class="server-btn active" id="btn-sub" onclick="setAudioMode('sub')">SUB</button>
                                <button class="server-btn" id="btn-dub" onclick="setAudioMode('dub')">DUB</button>
                            </div>
                        </div>
                    </div>

                    <div id="tv-controls" class="mb-12">
                        <div class="mb-4">
                            <label class="text-xs text-gray-400 ml-1">Select Episode</label>
                            <select id="episode-select" class="glass-select w-full p-3 rounded-xl font-bold text-white cursor-pointer" onchange="changeEpisode(this.value)">
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
   <div id="quote-section" class="mb-16 relative mt-12">
        <h2 class="text-xl md:text-2xl font-bold mb-8 text-white flex items-center px-2 section-title border-l-4 border-[#e50914] pl-3">
            Iconic Lines
        </h2>

        <div class="flex justify-center w-full px-4">
            <div class="quote-slider-wrapper relative">
                <button onclick="fetchNewQuote()" class="nav-arrow left-arrow">
                    <i class="fas fa-chevron-left"></i>
                </button>

                <div id="quote-card" class="card" onclick="fetchNewQuote()">
                    <div class="content">
                        <div class="header">
                            <strong id="q-char" class="text-red-500 text-lg md:text-xl">Loading...</strong>
                            <p id="q-anime" class="para text-sm text-gray-400">Please wait</p>
                        </div>
                        
                        <div class="footer mt-6">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 330 307" height="80" width="80" class="text-gray-700 mb-4 opacity-50">
                                <path d="M302.258 176.221C320.678 176.221 329.889 185.432 329.889 203.853V278.764C329.889 297.185 320.678 306.395 302.258 306.395H231.031C212.61 306.395 203.399 297.185 203.399 278.764V203.853C203.399 160.871 207.902 123.415 216.908 91.4858C226.323 59.1472 244.539 30.902 271.556 6.75027C280.562 -1.02739 288.135 -2.05076 294.275 3.68014L321.906 29.4692C328.047 35.2001 326.614 42.1591 317.608 50.3461C303.69 62.6266 292.228 80.4334 283.223 103.766C274.626 126.69 270.328 150.842 270.328 176.221H302.258ZM99.629 176.221C118.05 176.221 127.26 185.432 127.26 203.853V278.764C127.26 297.185 118.05 306.395 99.629 306.395H28.402C9.98126 306.395 0.770874 297.185 0.770874 278.764V203.853C0.770874 160.871 5.27373 123.415 14.2794 91.4858C23.6945 59.1472 41.9106 30.902 68.9277 6.75027C77.9335 -1.02739 85.5064 -2.05076 91.6467 3.68014L119.278 29.4692C125.418 35.2001 123.985 42.1591 114.98 50.3461C101.062 62.6266 89.6 80.4334 80.5942 103.766C71.9979 126.69 67.6997 150.842 67.6997 176.221H99.629Z"></path>
                            </svg>
                            <p id="q-text" class="para text-xl md:text-3xl font-serif italic text-white leading-relaxed">
                                "Loading iconic quote..."
                            </p>
                            <button class="button mt-6">
                                <span class="actor text-sm uppercase tracking-widest text-gray-500">Next Quote</span>
                            </button>
                        </div>
                    </div>
                </div>

                <button onclick="fetchNewQuote()" class="nav-arrow right-arrow">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
<script src="anime-script.js" defer></script>
</body>
</html>
