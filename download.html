<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Dubbed Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="dubbed-registry.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: white; }
        .backdrop-overlay { background: linear-gradient(to top, #0f172a 10%, rgba(15, 23, 42, 0.8) 50%, rgba(15, 23, 42, 0.3) 100%); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <div id="backdrop-bg" class="fixed inset-0 z-[-1] bg-cover bg-center transition-opacity duration-1000 opacity-30"></div>
    <div class="fixed inset-0 z-[-1] backdrop-overlay"></div>

    <header class="w-full p-4 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <a href="index.html" class="text-2xl font-bold tracking-wider text-white hover:text-purple-400 transition-colors">
            <i class="fas fa-home mr-2"></i>CHITHRUKA
        </a>
        <div class="relative w-full max-w-md">
            <input type="text" id="search-input" placeholder="Search for other movies..." class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">
            <button onclick="handleSearch()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-10 max-w-6xl flex flex-col md:flex-row gap-8 items-start">
        
        <div class="w-full md:w-1/3 flex-shrink-0">
            <img id="movie-poster" src="" alt="Movie Poster" class="w-full rounded-2xl shadow-2xl shadow-black/50 hidden border border-gray-700">
            <div id="poster-skeleton" class="w-full aspect-[2/3] bg-gray-800 animate-pulse rounded-2xl"></div>
        </div>

        <div class="w-full md:w-2/3 flex flex-col gap-6">
            
            <div>
                <img id="movie-logo" src="" alt="Movie Logo" class="h-24 object-contain mb-4 hidden">
                <h1 id="movie-title" class="text-4xl md:text-5xl font-extrabold mb-2 hidden"></h1>
                
                <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 font-semibold mb-4">
                    <span id="movie-year" class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"></span>
                    <span id="movie-runtime" class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"></span>
                    <span class="bg-purple-600/20 text-purple-300 px-3 py-1 rounded-md border border-purple-500/30">DUBBED</span>
                </div>
                
                <p id="movie-overview" class="text-gray-300 leading-relaxed text-lg"></p>
            </div>

            <hr class="border-gray-800 my-2">

            <div>
                <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
                    <i class="fas fa-download text-purple-500"></i> Download Links
                </h2>
                
                <div id="download-links-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    </div>
            </div>

        </div>
    </main>

    <script>    // ==========================================
    // 1. DYNAMIC CONFIGURATION & URL PARSING
    // ==========================================
    const TMDB_API_KEY = "92850a79e50917b8cc19623455ae2240"; 
    
    // Get the ID and Type from the URL (e.g., download.html?id=597&type=movie)
    const urlParams = new URLSearchParams(window.location.search);
    const movieIdParam = urlParams.get('id');
    const typeParam = urlParams.get('type');
    const MOVIE_ID = movieIdParam ? parseInt(movieIdParam) : null;

    // Lookup the movie in our registry
    let DOWNLOAD_LINKS = [];
    if (MOVIE_ID && typeof DUBBED_REGISTRY !== 'undefined' && DUBBED_REGISTRY[MOVIE_ID]) {
        DOWNLOAD_LINKS = DUBBED_REGISTRY[MOVIE_ID].links;
    }

    // ==========================================
    // 2. FETCH TMDB DATA & POPULATE PAGE
    // ==========================================
    async function fetchMovieDetails() {
        if (!MOVIE_ID) {
            document.getElementById('movie-overview').textContent = "Error: No ID provided in the URL.";
            return;
        }

        // Prioritize 'type' from URL, fallback to registry, fallback to 'movie'
        let mediaType = 'movie';
        if (typeParam === 'tv' || typeParam === 'movie') {
            mediaType = typeParam;
        } else if (typeof DUBBED_REGISTRY !== 'undefined' && DUBBED_REGISTRY[MOVIE_ID] && DUBBED_REGISTRY[MOVIE_ID].type) {
            mediaType = DUBBED_REGISTRY[MOVIE_ID].type;
        }

        try {
            // Dynamically inject the correct mediaType into the URL
            const response = await fetch(`https://api.themoviedb.org/3/${mediaType}/${MOVIE_ID}?api_key=${TMDB_API_KEY}&append_to_response=images`);
            const data = await response.json();

            // Set Poster
            const posterImg = document.getElementById('movie-poster');
            if (data.poster_path) {
                posterImg.src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
                posterImg.onload = () => {
                    document.getElementById('poster-skeleton').classList.add('hidden');
                    posterImg.classList.remove('hidden');
                };
            }

            // Set Backdrop
            if (data.backdrop_path) {
                document.getElementById('backdrop-bg').style.backgroundImage = `url(https://image.tmdb.org/t/p/w1280${data.backdrop_path})`;
            }

            // Handle Logo vs Text Title (Support both data.title and data.name)
            const englishLogos = data.images?.logos?.filter(logo => logo.iso_639_1 === 'en') || [];
            const logoImg = document.getElementById('movie-logo');
            const titleText = document.getElementById('movie-title');
            
            if (englishLogos.length > 0) {
                logoImg.src = `https://image.tmdb.org/t/p/w500${englishLogos[0].file_path}`;
                logoImg.classList.remove('hidden');
            } else {
                titleText.textContent = data.title || data.name; 
                titleText.classList.remove('hidden');
            }

            // Set Metadata (Support TV properties)
            const releaseDate = data.release_date || data.first_air_date;
            document.getElementById('movie-year').textContent = releaseDate ? releaseDate.substring(0, 4) : 'N/A';
            
            const runtime = data.runtime || (data.episode_run_time && data.episode_run_time.length > 0 ? data.episode_run_time[0] : null);
            document.getElementById('movie-runtime').textContent = runtime ? `${runtime} min` : 'N/A';
            
            document.getElementById('movie-overview').textContent = data.overview;

        } catch (error) {
            console.error("Failed to fetch TMDB details:", error);
            document.getElementById('movie-overview').textContent = "Error loading details.";
        }
    }

    // ==========================================
    // 3. RENDER DOWNLOAD LINKS
    // ==========================================
    function renderDownloadLinks() {
        const container = document.getElementById('download-links-container');
        container.innerHTML = '';

        if (!MOVIE_ID || typeof DUBBED_REGISTRY === 'undefined' || !DUBBED_REGISTRY[MOVIE_ID] || DOWNLOAD_LINKS.length === 0) {
            container.innerHTML = `<p class="text-gray-400 italic">No dubbed links are currently available for this title. Please check back later.</p>`;
            return;
        }

        DOWNLOAD_LINKS.forEach(link => {
            const card = document.createElement('a');
            card.href = link.url;
            card.target = "_blank";
            card.className = "flex flex-col p-4 bg-gray-800/60 hover:bg-purple-600/20 border border-gray-700 hover:border-purple-500 rounded-xl transition-all group";
            
            card.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <span class="font-bold text-white group-hover:text-purple-400 transition-colors text-lg">${link.language}</span>
                    <i class="fas fa-external-link-alt text-gray-500 group-hover:text-purple-400"></i>
                </div>
                <div class="flex items-center gap-2 text-sm text-gray-400">
                    <span class="bg-gray-900 px-2 py-1 rounded text-gray-300"><i class="fas fa-video mr-1"></i> ${link.quality}</span>
                    <span class="bg-gray-900 px-2 py-1 rounded text-gray-300"><i class="fas fa-hdd mr-1"></i> ${link.size}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // ==========================================
    // 4. SEARCH FUNCTIONALITY
    // ==========================================
    function handleSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (query) {
            window.location.href = `index.html?search=${encodeURIComponent(query)}`;
        }
    }

    const searchInput = document.getElementById('search-input');
    if (searchInput) {
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleSearch();
        });
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
        fetchMovieDetails();
        renderDownloadLinks();
    });
</script>
</body>
</html>
