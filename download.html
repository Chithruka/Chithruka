<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Dubbed Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="dubbed-registry.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: white; }
        .backdrop-overlay { background: linear-gradient(to top, #0f172a 10%, rgba(15, 23, 42, 0.8) 50%, rgba(15, 23, 42, 0.3) 100%); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <div id="backdrop-bg" class="fixed inset-0 z-[-1] bg-cover bg-center transition-opacity duration-1000 opacity-30"></div>
    <div class="fixed inset-0 z-[-1] backdrop-overlay"></div>

    <header class="w-full p-4 flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800">
        <a href="index.html" class="text-2xl font-bold tracking-wider text-white hover:text-purple-400 transition-colors">
            <i class="fas fa-home mr-2"></i>CHITHRUKA
        </a>
        <div class="relative w-full max-w-md">
            <input type="text" id="search-input" placeholder="Search for other movies..." class="w-full bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">
            <button onclick="handleSearch()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

   <main class="flex-grow container mx-auto px-4 py-10 max-w-6xl flex flex-col md:flex-row gap-8 items-start">
    <div class="w-full md:w-1/3 flex-shrink-0">
        <img id="movie-poster" src="" alt="Movie Poster" class="w-full rounded-2xl shadow-2xl shadow-black/50 hidden border border-gray-700">
        <div id="poster-skeleton" class="w-full aspect-[2/3] bg-gray-800 animate-pulse rounded-2xl"></div>
    </div>

    <div class="w-full md:w-2/3 flex flex-col gap-6">
        <div>
            <img id="movie-logo" src="" alt="Movie Logo" class="h-24 object-contain mb-4 hidden">
            <h1 id="movie-title" class="text-4xl md:text-5xl font-extrabold mb-2 hidden"></h1>
            
            <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300 font-semibold mb-4">
                <span id="movie-year" class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"></span>
                <span id="movie-runtime" class="bg-gray-800 px-3 py-1 rounded-md border border-gray-700"></span>
                <span class="bg-purple-600/20 text-purple-300 px-3 py-1 rounded-md border border-purple-500/30">DUBBED</span>
            </div>
            
            <p id="movie-overview" class="text-gray-300 leading-relaxed text-lg"></p>
        </div>

        <hr class="border-gray-800 my-2">

        <div id="download-section">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
                <i class="fas fa-download text-purple-500"></i> Download Links
            </h2>
            <div id="download-links-container" class="flex flex-col gap-8">
                </div>
        </div>
    </div>
</main>

<footer class="w-full py-8 mt-10 bg-gray-900/80 border-t border-gray-800 text-center text-gray-500 text-sm">
    <p>&copy; <span id="current-year"></span> Chithruka. All Rights Reserved.</p>
</footer>

<script>
    const TMDB_API_KEY = "92850a79e50917b8cc19623455ae2240"; 
    const urlParams = new URLSearchParams(window.location.search);
    const movieIdParam = urlParams.get('id');
    const typeParam = urlParams.get('type');
    const MOVIE_ID = movieIdParam ? parseInt(movieIdParam) : null;

    let tmdbLogos = [];

    // 1. Fetch Movie Details and Image Assets
  // 1. Fetch Movie Details and Image Assets
async function fetchMovieDetails() {
    if (!MOVIE_ID) return;

    // Determine if we are looking for a 'movie' or 'tv' series
    let mediaType = typeParam || (DUBBED_REGISTRY[MOVIE_ID]?.type) || 'movie';

    try {
        // We append 'images' for logos, and 'translations'/'alternative_titles' for native text fallbacks
        const response = await fetch(`https://api.themoviedb.org/3/${mediaType}/${MOVIE_ID}?api_key=${TMDB_API_KEY}&append_to_response=images,translations,alternative_titles`);
        const data = await response.json();

        // Store data globally for the renderGroupedLinks function to access
        tmdbLogos = data.images?.logos || [];
        window.tmdbTranslations = data.translations?.translations || [];
        // TV shows use .results, movies usually use .titles for alt_titles
        window.tmdbAltTitles = data.alternative_titles?.titles || data.alternative_titles?.results || [];

        // --- UI Population ---

        // 1. Poster Image Logic
        const posterImg = document.getElementById('movie-poster');
        if (data.poster_path) {
            posterImg.src = `https://image.tmdb.org/t/p/w500${data.poster_path}`;
            posterImg.onload = () => {
                document.getElementById('poster-skeleton').classList.add('hidden');
                posterImg.classList.remove('hidden');
            };
        }

        // 2. Background Backdrop
        if (data.backdrop_path) {
            document.getElementById('backdrop-bg').style.backgroundImage = `url(https://image.tmdb.org/t/p/w1280${data.backdrop_path})`;
        }

        // 3. Main Title Logo (Defaulting to English logo for the top header)
        const mainLogo = tmdbLogos.find(l => l.iso_639_1 === 'en') || tmdbLogos[0];
        if (mainLogo) {
            document.getElementById('movie-logo').src = `https://image.tmdb.org/t/p/w500${mainLogo.file_path}`;
            document.getElementById('movie-logo').classList.remove('hidden');
            document.getElementById('movie-title').classList.add('hidden');
        } else {
            document.getElementById('movie-title').textContent = data.title || data.name;
            document.getElementById('movie-title').classList.remove('hidden');
            document.getElementById('movie-logo').classList.add('hidden');
        }

        // 4. Meta Information (Year, Runtime, Overview)
        const releaseDate = data.release_date || data.first_air_date;
        document.getElementById('current-year').textContent = new Date().getFullYear();
        document.getElementById('movie-year').textContent = releaseDate ? releaseDate.substring(0, 4) : 'N/A';
        
        // Handle runtime for both Movies (runtime) and TV (episode_run_time)
        const runtime = data.runtime || (data.episode_run_time && data.episode_run_time[0]) || 'N/A';
        document.getElementById('movie-runtime').textContent = runtime !== 'N/A' ? `${runtime} min` : 'N/A';
        
        document.getElementById('movie-overview').textContent = data.overview;

        // 5. Trigger the Link Rendering
        renderGroupedLinks();

    } catch (error) {
        console.error("Error fetching movie details:", error);
        document.getElementById('download-links-container').innerHTML = 
            `<p class="text-red-400 text-center">Failed to load movie details. Please check your connection.</p>`;
    }
}


// 2. Group and Render Links by Language
function renderGroupedLinks() {
    const container = document.getElementById('download-links-container');
    if (!MOVIE_ID || !DUBBED_REGISTRY[MOVIE_ID]) {
        container.innerHTML = `<p class="text-gray-400 italic text-center">No links available.</p>`;
        return;
    }

    const langMap = {
        "Sinhala": "si",
        "Hindi": "hi",
        "Tamil": "ta",
        "English": "en",
        "Malayalam": "ml"
    };

    const links = DUBBED_REGISTRY[MOVIE_ID].links;
    const grouped = links.reduce((acc, link) => {
        if (!acc[link.language]) acc[link.language] = [];
        acc[link.language].push(link);
        return acc;
    }, {});

    container.innerHTML = '';

    for (const [language, langLinks] of Object.entries(grouped)) {
        const isoCode = langMap[language];
        
        // 1. Try to find Logo
        const langLogo = tmdbLogos.find(l => l.iso_639_1 === isoCode);

        // 2. Try to find Native Name (from translations or alt titles)
        let nativeName = "";
        if (!langLogo) {
            const translation = window.tmdbTranslations.find(t => t.iso_639_1 === isoCode);
            if (translation && translation.data.title) {
                nativeName = translation.data.title;
            } else if (translation && translation.data.name) {
                nativeName = translation.data.name;
            } else {
                const alt = window.tmdbAltTitles.find(a => a.iso_3166_1 === isoCode.toUpperCase() || a.iso_639_1 === isoCode);
                if (alt) nativeName = alt.title;
            }
        }

        const section = document.createElement('div');
        section.className = "space-y-4 mb-8";
        
        // Header logic: Show Logo OR Native Name OR English Name
        let headerDisplay;
        if (langLogo) {
            headerDisplay = `<img src="https://image.tmdb.org/t/p/w200${langLogo.file_path}" class="h-8 object-contain" alt="${language}">`;
        } else if (nativeName) {
            headerDisplay = `<span class="text-2xl font-bold text-white">${nativeName}</span> 
                             <span class="text-sm text-gray-500 ml-2">(${language})</span>`;
        } else {
            headerDisplay = `<span class="text-2xl font-bold text-white">${language}</span>`;
        }

        section.innerHTML = `
            <div class="flex items-center gap-3 border-b border-gray-800 pb-2">
                ${headerDisplay}
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                ${langLinks.map(link => `
                    <div class="relative group flex items-center bg-gray-800/40 border border-gray-700 hover:border-purple-500 rounded-lg transition-all overflow-hidden">
                        <a href="${link.url}" target="_blank" class="flex-grow flex items-center justify-between p-3 hover:bg-purple-600/10">
                            <div class="flex flex-col">
                                <span class="text-xs text-gray-500 font-bold uppercase tracking-tighter">${link.quality}</span>
                                <span class="text-sm text-gray-200">${link.size}</span>
                            </div>
                            <i class="fas fa-cloud-download-alt text-gray-600 group-hover:text-purple-400 transition-colors"></i>
                        </a>
                        <button onclick="copyToClipboard('${link.url}', this)" class="p-4 bg-gray-800/60 hover:bg-purple-600 text-gray-400 hover:text-white border-l border-gray-700 transition-colors" title="Copy Link">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                `).join('')}
            </div>
        `;
        container.appendChild(section);
    }
}



function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
        const icon = btn.querySelector('i');
        const originalClass = icon.className;
        
        // Visual feedback
        icon.className = 'fas fa-check text-green-400';
        btn.classList.add('bg-green-900/20');
        
        setTimeout(() => {
            icon.className = originalClass;
            btn.classList.remove('bg-green-900/20');
        }, 2000);
    }).catch(err => {
        console.error('Failed to copy: ', err);
    });
}


    // 3. Search Logic
    function handleSearch() {
        const query = document.getElementById('search-input').value.trim();
        if (query) window.location.href = `index.html?search=${encodeURIComponent(query)}`;
    }

    document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSearch();
    });

    document.addEventListener('DOMContentLoaded', fetchMovieDetails);
</script>

</body>
</html>
