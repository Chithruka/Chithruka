m: 25%; } .attribution { right: 15px; bottom: 10px; font-size: 0.65rem; } } </style></head><body><header><img src="https://assets.nflxext.com/en_us/home/logo_v7.png" alt="Netflix Logo" class="logo" id="logo"></header><main><div class="content"><h1>Lost your way?</h1><p> Sorry, we can't find that <br> page. You'll find lots to <br> explore on the home page. </p><button class="home-btn" id="homeBtn">Netflix Home</button></div><div class="error-code"> Error Code NSES-404 </div><div class="attribution"> FROM <strong>LOST IN SPACE</strong></div></main><script> const redirectUrl = 'https://chithruka.github.io/Chithruka/index.html'; document.getElementById('homeBtn').addEventListener('click', () => { window.location.href = redirectUrl; }); document.getElementById('logo').addEventListener('click', () => { window.location.href = redirectUrl; }); </script></body></html>
