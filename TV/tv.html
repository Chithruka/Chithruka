<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro IPTV Multi-Source</title>
    <link href='https://chithruka.blogspot.com/favicon.ico' rel='shortcut icon' type='image/x-icon'/>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<style>
    /* Ensure Video.js fills our screen-wrapper */
    .video-js {
        width: 100% !important;
        height: 100% !important;
    }
    /* Hide the default big play button for the "TV" feel */
    .vjs-big-play-button { display: none !important; }
        /* --- CORE LAYOUT --- */
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ccc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            height: 100vh;
            overflow: hidden; 
        }

        #tv-station {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #0f0f0f;
            overflow: hidden;
        }

        #tv-chassis {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 20px;
            box-shadow: inset 0 0 10px #000, 0 0 50px rgba(0,0,0,0.8), 0 0 0 5px #111;
            width: 90%;
            max-width: 1000px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        /* Fullscreen Logic */
        #tv-chassis:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            padding: 0;
            border-radius: 0;
            background: black;
            justify-content: center; 
        }

        #tv-chassis:fullscreen #screen-wrapper {
            height: 100%;
            border: none;
            border-radius: 0;
        }

        #tv-chassis:fullscreen .tv-controls-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 50px;
            width: auto;
            min-width: 300px;
            z-index: 2147483647; 
        }
        
        #tv-chassis:fullscreen .brand { display: none; }

        #screen-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            border: 8px solid #111;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* --- CONTROLS --- */
        .tv-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            position: relative;
            z-index: 100;
        }

        .brand { font-weight: bold; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-bottom: 5px; }
        .desktop-badge { display: inline; font-size: 0.6em; }
        .mobile-badge { display: none; font-size: 0.6em; }

        /* --- SIDEBAR --- */
        #playlist-sidebar {
            width: 350px;
            background-color: #1a1a1a;
            border-left: 2px solid #333;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* --- MOBILE PORTRAIT --- */
        @media (max-width: 900px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            #tv-station { padding: 10px 0; width: 100%; min-height: auto; background: #000; }
            #tv-chassis { width: 100%; padding: 10px; border-radius: 0; box-shadow: none; box-sizing: border-box; }
            #screen-wrapper { border-width: 2px; }
            #playlist-sidebar { width: 100%; height: 500px; border-left: none; border-top: 2px solid #333; }
            .tv-controls-bar { flex-direction: column; gap: 10px; }
            .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; gap: 5px; }
            button { padding: 12px 5px; font-size: 10px; }
            
            .desktop-badge { display: none; }
            .mobile-badge { display: inline; }
        }

        /* --- MOBILE LANDSCAPE --- */
        @media (orientation: landscape) and (max-width: 900px) {
            body { overflow: hidden; }
            #tv-station { padding: 0; height: 100vh; width: 100vw; background: #000; }
            #tv-chassis { width: 100%; height: 100%; padding: 0; border: none; border-radius: 0; }
            #screen-wrapper { width: 100%; height: 100%; border: none; border-radius: 0; aspect-ratio: unset; }
            #playlist-sidebar { display: none; }
            
            .tv-controls-bar {
                position: absolute; bottom: 10px; left: 10px; right: 10px;
                background: rgba(0,0,0,0.7); padding: 5px; border-radius: 8px; z-index: 200;
                flex-direction: row; 
            }
            .brand { display: none; } 
            .btn-group { display: flex; width: 100%; }
            #current-channel-display { display: none; }
        }

        /* --- VFX & REC --- */
        #rec-overlay { position: absolute; top: 20px; right: 30px; color: red; font-weight: bold; font-size: 24px; display: none; z-index: 20; text-shadow: 0 0 5px black; pointer-events: none; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .scanlines, .noise, .vignette { display: none; pointer-events: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
        .retro-mode .scanlines { display: block; background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2)); background-size: 100% 4px; animation: scrollLines 10s linear infinite; }
        .retro-mode .noise { display: block; opacity: 0.05; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAA5OTkAAABMTExERERmZmYzMzPMzMxmoqmdAAAACHRSTlMAMwA3M2YzMzNmIzM3AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAAiklEQVQ4jWNgwA0YzQgAPQMmrkG0kQ5B0QYSQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BBEG0kM0QYyQ0cQ6BAAAM+uD63F1W5iAAAAAElFTkSuQmCC'); animation: noiseAnim 0.2s steps(4) infinite; }
        .retro-mode .vignette { display: block; box-shadow: inset 0 0 150px rgba(0,0,0,0.9); }
        .retro-mode video { filter: contrast(1.2) brightness(1.1) saturate(1.1) sepia(0.2); }
        @keyframes scrollLines { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
        @keyframes noiseAnim { 0% { transform: translate(0,0); } 100% { transform: translate(5%,0); } }

        .btn-group { display: flex; gap: 10px; }
        button { padding: 8px 16px; background: #444; border: 1px solid #222; color: white; cursor: pointer; font-family: inherit; text-transform: uppercase; font-size: 12px; box-shadow: 0 2px 0 #000; }
        button:active { transform: translateY(2px); box-shadow: inset 0 2px 0 #000; }
        button.active-btn { background: #d63031; }
        #rec-btn.recording { background-color: red; color: white; border-color: darkred; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
        #playlist-header { padding: 15px; background-color: #222; border-bottom: 2px solid #333; }
        .filter-group { display: flex; gap: 5px; margin-bottom: 10px; }
        select, input[type="text"] { background: #333; color: #ccc; border: 1px solid #444; padding: 8px; width: 100%; box-sizing: border-box; }
        #channel-list { flex: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        #channel-list::-webkit-scrollbar { width: 10px; background: #222;}
        #channel-list::-webkit-scrollbar-thumb { background: #444; }
        .channel-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #252525; display: flex; align-items: center; font-size: 12px; }
        .channel-item:hover { background-color: #333; }
        .channel-item.active { background-color: #d63031; color: white; }
        .channel-logo { width: 30px; height: 30px; margin-right: 12px; object-fit: contain; background: #ccc; }
        .channel-info { display: flex; flex-direction: column; }
    </style>
</head>
<body>

    <div id="tv-station">
        <div id="tv-chassis">
 <div id="screen-wrapper">
    <div id="rec-overlay" class="blink">● REC</div>
    <div class="scanlines"></div>
    <div class="noise"></div>
    <div class="vignette"></div>
    
    <video 
        id="video-player" 
        class="video-js vjs-default-skin vjs-big-play-centered" 
        controls preload="auto" autoplay muted playsinline>
    </video>

    <iframe 
        id="iframe-player" 
        allow="autoplay; fullscreen; encrypted-media" 
        style="display:none; width:100%; height:100%; border:none; position:relative; z-index:5;">
    </iframe>
</div>

            <div class="tv-controls-bar">
                <div class="brand">
                    Sony Trinitron 
                    <span class="desktop-badge">EMULATION</span>
                    <span class="mobile-badge">MOBILE</span>
                </div>
                <div class="btn-group">
                    <button id="vfx-btn" onclick="toggleVFX()">VCR FX: OFF</button>
                    <button id="rec-btn" onclick="toggleRecording()">● Record</button>
                    <button id="fs-btn" onclick="toggleFullscreen()">[ ] FULLSCREEN</button>
                </div>
            </div>
            
            <div style="margin-top:10px; text-align:center; color:#555; font-size: 0.8em;" id="current-channel-display">NO SIGNAL</div>
        </div>
    </div>

    <div id="playlist-sidebar">
        <div id="playlist-header">
            <div class="filter-group">
                <select id="country-filter" onchange="applyFilters()"><option value="all">ALL COUNTRIES</option></select>
                <select id="category-filter" onchange="applyFilters()"><option value="all">ALL CATEGORIES</option></select>
            </div>
            <input type="text" id="search-box" placeholder="SEARCH..." onkeyup="applyFilters()">
            <div style="margin-top: 5px; font-size: 0.7em; color: #666; text-align: right;">
                <span id="channel-count">0</span> CHANNELS
            </div>
        </div>
        <ul id="channel-list">
            <li style="padding:20px; text-align:center; color:#666;">TUNING...</li>
        </ul>
    </div>

    <script>// --- INITIALIZE VIDEO.JS PLAYER ---
const player = videojs('video-player', {
    fluid: false,
    autoplay: true,
    controls: true,
    responsive: true,
    playbackRates: [0.5, 1, 1.5, 2]
});

// --- CONFIGURATION & STATE ---
const PLAYLIST_SOURCES = [
    'https://chithruka.github.io/Chithruka/TV/playlist.m3u8'
];

// Added custom_channels.json to the API sources
const API_SOURCES = [
    'https://api.cdn-live.tv/api/v1/channels/?user=cdnlivetv&plan=free',
    'custom_channels.json' 
];

const tvChassis = document.getElementById('tv-chassis'); 
const screenWrapper = document.getElementById('screen-wrapper');
const fsBtn = document.getElementById('fs-btn');
const channelList = document.getElementById('channel-list');
const channelDisplay = document.getElementById('current-channel-display');
const countrySelect = document.getElementById('country-filter');
const categorySelect = document.getElementById('category-filter');
const searchBox = document.getElementById('search-box');
const vfxBtn = document.getElementById('vfx-btn');
const recBtn = document.getElementById('rec-btn');
const recOverlay = document.getElementById('rec-overlay');

// Hybrid Player Elements
const iframePlayer = document.getElementById('iframe-player');
const videoElement = document.getElementById('video-player');

let mediaRecorder;
let recordedChunks = [];
let isRecording = false;
let currentChannelName = "Unknown_Channel";
let allChannels = []; 

// --- BOOTSTRAP: FETCH SOURCES ---
const statusMsg = document.querySelector('#channel-list li');
if(statusMsg) statusMsg.innerText = "Scanning Frequencies...";

const m3u8Promises = PLAYLIST_SOURCES.map(url => 
    fetch(url).then(res => res.text()).then(text => parseM3U(text))
);

const apiPromises = API_SOURCES.map(url => 
    fetch(url).then(res => res.json()).then(data => parseJSONAPI(data))
);

Promise.allSettled([...m3u8Promises, ...apiPromises])
    .then(results => {
        let combinedData = [];
        results.forEach((result) => {
            if (result.status === 'fulfilled') {
                combinedData = [...combinedData, ...result.value];
            }
        });

        allChannels = combinedData;
        populateDropdowns(allChannels);
        applyFilters(); 
        
        if(allChannels.length === 0) {
            channelList.innerHTML = '<li style="padding:20px; text-align:center; color:red;">No Signal Found.</li>';
        }
    });

// --- UTILITY: YOUTUBE CONVERTER ---
function getEmbedUrl(url) {
    const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
    if (ytMatch && ytMatch[1]) {
        return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&modestbranding=1`;
    }
    return url; 
}

// --- PARSERS ---
function parseM3U(content) {
    const lines = content.split('\n');
    const channels = [];
    
    // Give currentChannel a default skeleton instead of {}
    let currentChannel = { name: "Unknown Channel", group: "Uncategorized", country: "INT" };
    
    lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
            const logoMatch = line.match(/tvg-logo="([^"]*)"/);
            const groupMatch = line.match(/group-title="([^"]*)"/);
            const countryMatch = line.match(/tvg-country="([^"]*)"/);
            const nameParts = line.split(',');
            
            currentChannel = {
                name: nameParts[nameParts.length - 1]?.trim() || "Unknown Channel",
                logo: logoMatch ? logoMatch[1] : null,
                group: groupMatch ? groupMatch[1] : 'Uncategorized',
                country: countryMatch ? countryMatch[1] : 'INT',
            };
        } else if (line.startsWith('http')) {
            currentChannel.url = line;
            currentChannel.type = line.includes('youtube.com') ? 'embed' : 'm3u8';
            channels.push(currentChannel);
            
            // Reset back to the skeleton skeleton
            currentChannel = { name: "Unknown Channel", group: "Uncategorized", country: "INT" };
        }
    });
    return channels;
}

function parseJSONAPI(data) {
    const channels = [];
    let list = Array.isArray(data) ? data : (data.channels || data.data || data.results || []);
    
    list.forEach(item => {
        let streamUrl = item.url || item.stream_url || item.link || item.hls;
        if (!streamUrl) return; 
        
        // Auto-detect type if not provided in JSON
        let type = item.type;
        if (!type) {
            type = (streamUrl.includes('.m3u8') || streamUrl.includes('.ts')) ? 'm3u8' : 'embed';
        }
        
        channels.push({
            name: item.name || item.title || "Unknown Channel",
            logo: item.logo || item.icon || null,
            group: item.group || item.category || 'Uncategorized',
            country: item.country || 'INT',
            url: streamUrl,
            type: type
        });
    });
    return channels;
}

// --- CORE PLAYBACK LOGIC ---
function playStream(channel, element) {
    currentChannelName = channel.name;
    channelDisplay.innerText = "TUNED: " + channel.name.toUpperCase();
    
    // Stop recording if active (recording iframes is not supported)
    if(isRecording) stopRecording();

    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    if(element) element.classList.add('active');

    if (channel.type === 'embed') {
        // Switch to Iframe mode
        player.pause();
        videoElement.style.display = 'none';
        iframePlayer.style.display = 'block';
        iframePlayer.src = getEmbedUrl(channel.url);
    } else {
        // Switch to Video.js mode
        iframePlayer.src = "";
        iframePlayer.style.display = 'none';
        videoElement.style.display = 'block';
        
        player.src({
            src: channel.url,
            type: 'application/x-mpegURL'
        });
        player.play().catch(e => console.log("Stream error or blocked."));
    }
}

// --- RECORDING ENGINE (Only works for Video.js sources) ---
function toggleRecording() {
    if (videoElement.style.display === 'none') {
        alert("Recording is not supported for external embedded websites due to security restrictions.");
        return;
    }
    if (!isRecording) startRecording();
    else stopRecording();
}

function startRecording() {
    const rawVideo = document.querySelector('#video-player_html5_api');
    if (!rawVideo || rawVideo.paused) { 
        alert("No active video stream to record!"); 
        return; 
    }
    
    let stream;
    try {
        stream = rawVideo.captureStream ? rawVideo.captureStream() : rawVideo.mozCaptureStream();
    } catch (e) { 
        alert("CORS restriction: This stream cannot be recorded."); 
        return; 
    }

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = saveRecording;
    mediaRecorder.start();
    
    isRecording = true;
    recBtn.innerText = "■ STOP";
    recBtn.classList.add('recording');
    recOverlay.style.display = 'block';
}

function stopRecording() {
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    recBtn.innerText = "● RECORD";
    recBtn.classList.remove('recording');
    recOverlay.style.display = 'none';
}

function saveRecording() {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    let safeName = currentChannelName.replace(/[^a-zA-Z0-9]/g, "_");
    a.href = url;
    a.download = `${safeName}_${new Date().getTime()}.webm`;
    a.click();
    window.URL.revokeObjectURL(url);
}

// --- UI & FILTERS ---
function toggleVFX() {
    screenWrapper.classList.toggle('retro-mode');
    vfxBtn.innerText = screenWrapper.classList.contains('retro-mode') ? "VCR FX: ON" : "VCR FX: OFF";
    vfxBtn.classList.toggle('active-btn');
}

async function toggleFullscreen() {
    if (!document.fullscreenElement) {
        tvChassis.requestFullscreen().catch(err => console.error(err));
    } else {
        document.exitFullscreen();
    }
}

function populateDropdowns(channels) {
    const countries = [...new Set(channels.map(c => c.country))].filter(Boolean).sort();
    const categories = [...new Set(channels.map(c => c.group))].filter(Boolean).sort();
    
    countries.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.innerText = c.toUpperCase();
        countrySelect.appendChild(opt);
    });
    categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.innerText = c;
        categorySelect.appendChild(opt);
    });
}

function applyFilters() {
    const cVal = countrySelect.value;
    const gVal = categorySelect.value;
    const sVal = searchBox.value.toLowerCase();

    const filtered = allChannels.filter(ch => {
        // Provide fallbacks to prevent undefined crashes
        const country = ch.country || 'INT';
        const group = ch.group || 'Uncategorized';
        const name = ch.name || 'Unknown Channel';

        return (cVal === 'all' || country === cVal) &&
               (gVal === 'all' || group === gVal) &&
               (name.toLowerCase().includes(sVal));
    });
    renderChannels(filtered);
}

function renderChannels(channels) {
    channelList.innerHTML = '';
    document.getElementById('channel-count').innerText = channels.length;
    
    channels.slice(0, 300).forEach(channel => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        li.onclick = () => playStream(channel, li);
        
        const img = document.createElement('img');
        img.src = channel.logo || 'https://via.placeholder.com/30?text=TV';
        img.className = 'channel-logo';
        img.onerror = function() { this.src = 'https://via.placeholder.com/30?text=TV'; };
        
        const div = document.createElement('div');
        div.className = 'channel-info';
        div.innerHTML = `<span>${channel.name}</span><span style="color:#666; font-size:0.8em">${channel.country.toUpperCase()}</span>`;
        
        li.appendChild(img);
        li.appendChild(div);
        channelList.appendChild(li);
    });
}</script>
</body>

</html>
