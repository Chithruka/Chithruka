<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&family=Albert+Sans:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../pref-patch.css">
    
    <style>
        :root {
            --netflix-red: #E50914;
            --netflix-dark: #141414;
            --netflix-black: #000000;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            overflow-x: hidden;
            max-width: 100%;
        }

        body {
            background-color: var(--netflix-dark);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            max-width: 100%;
            padding-bottom: 50px;
        }

        /* Override pref-patch.css's negative offsets on .scroll-btn, which push
           the row scroll arrows 10px past the viewport edge and cause the page
           to gain horizontal scroll. This rule loads after pref-patch.css and
           matches its specificity, so it wins without editing the shared file. */
        .row-scroll-wrapper .scroll-btn.left-0 {
            left: 0;
        }

        .row-scroll-wrapper .scroll-btn.right-0 {
            right: 0;
        }

        /* --- Header / Navbar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            transition: background-color 0.3s;
        }

        header.scrolled {
            background-color: var(--netflix-dark);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            height: 34px;
            width: auto;
            display: block;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }

        .logo-games {
            font-family: 'Albert Sans', sans-serif;
            font-weight: 600;
            color: var(--text-white);
            font-size: 1.6rem;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--text-gray);
            padding: 5px 10px;
            border-radius: 4px; /* Netflix uses square buttons mostly, but slight radius handles mobile better */
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            padding: 5px;
            font-size: 1rem;
            outline: none;
            width: 0;
            transition: width 0.4s ease;
            cursor: pointer;
        }

        .search-container:hover input, .search-container input:focus, .search-container input:not(:placeholder-shown) {
            width: 200px;
            cursor: text;
        }

        .search-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
        }

        /* --- Hero Section --- */
        .hero {
            height: 70vh;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 4%;
            background-color: var(--netflix-black);
            overflow: hidden;
        }

        .hero-bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.2s ease;
            z-index: 0;
        }

        .hero-bg-layer.active {
            opacity: 1;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(20,20,20,1) 10%, rgba(20,20,20,0.15) 55%, rgba(20,20,20,0.55) 100%);
            z-index: 1;
        }

        .hero::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 15%;
            background: linear-gradient(to top, var(--netflix-dark) 0%, rgba(20,20,20,0) 100%);
            z-index: 1;
        }

        .hero-content {
            max-width: 500px;
            position: relative;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .hero-dots {
            position: absolute;
            left: 4%;
            bottom: 24px;
            display: flex;
            gap: 8px;
            z-index: 3;
        }

        .hero-dot {
            width: 26px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.35);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .hero-dot.active {
            background-color: var(--netflix-red);
        }

        .hero-tag {
            color: var(--netflix-red);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px black;
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4.5rem;
            line-height: 1;
            letter-spacing: 1px;
            color: var(--text-white);
            text-shadow: 2px 4px 10px rgba(0,0,0,0.7);
            margin-bottom: 16px;
        }

        .hero-desc {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px black;
            max-width: 460px;
        }

        .btn-play {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .btn-play:hover {
            opacity: 0.8;
        }

        /* --- Game Rows --- */
        .category-title {
            margin: 40px 4% 12px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #e5e5e5;
            letter-spacing: 0.3px;
        }

        .row-container {
            display: flex;
            overflow-x: auto;
            overflow-y: visible;
            padding: 16px 4%;
            gap: 14px;
            scrollbar-width: none; /* Firefox */
        }
        
        .row-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        /* Positioning context for the scroll-btn pair from pref-patch.css */
        .row-scroll-wrapper {
            position: relative;
        }

        .game-card {
            flex: 0 0 auto;
            width: 250px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background-color: #181818;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-poster {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background-color: #000;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .card-poster::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 45%);
        }

        .card-play-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .card-play-badge svg {
            width: 42px;
            height: 42px;
            fill: rgba(255,255,255,0.95);
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }

        .game-card:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 10;
        }

        .game-card:hover img {
            transform: scale(1.05);
        }

        .game-card:hover .card-play-badge {
            opacity: 1;
        }

        .card-info {
            padding: 10px 12px;
            border-top: 2px solid transparent;
            transition: border-color 0.25s ease;
        }

        .game-card:hover .card-info {
            border-color: var(--netflix-red);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-category {
            font-size: 0.72rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        /* --- Search Results Area --- */
        #search-results {
            display: none;
            padding: 80px 4%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        #search-results.active {
            display: grid;
        }
        
        #main-view.hidden {
            display: none;
        }

        /* --- Game Modal / Player --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            height: 80%;
            max-width: 1000px;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Helper for the raw script games */
        .script-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white; /* Some script games need white bg */
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .game-card { width: 160px; }
            .card-title { font-size: 0.8rem; }
            .card-category { font-size: 0.65rem; }
            .hero-title { font-size: 2.6rem; }
            .hero-desc { font-size: 0.95rem; }
            .search-container input:focus { width: 120px; }
            .logo-icon { height: 24px; }
            .logo-games { font-size: 1.15rem; }
        }
        /* --- DESKTOP SIDEBAR --- */
.sidebar {
    position: fixed; left: 0; top: 0; height: 100%;
    background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 9999; transition: width 0.3s ease;
    width: 64px; overflow: hidden; display: none; flex-direction: column;
}
.sidebar:hover { width: 240px; }
.sidebar-header { height: 70px; display: flex; align-items: center; padding-left: 18px; }
.sidebar-menu { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 0 8px; width: 240px; list-style: none; }
.nav-link { 
    display: flex; align-items: center; padding: 12px; border-radius: 12px;
    color: #9ca3af; text-decoration: none; transition: 0.3s;
}
.nav-link i { font-size: 1.2rem; min-width: 30px; text-align: center; }
.nav-link .nav-text { margin-left: 15px; opacity: 0; white-space: nowrap; }
.sidebar:hover .nav-text { opacity: 1; }
.nav-link:hover, .nav-link.active { background: rgba(229, 9, 20, 0.1); color: #e50914; }

/* --- REDESIGNED MOBILE NAVIGATION --- */
.mobile-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
    background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center;
    z-index: 9999;
}
.nav-wrapper { display: flex; width: 100%; justify-content: space-around; padding: 0; margin: 0; }
.mobile-item { list-style: none; flex: 1; padding: 0 4px; }
.mobile-item a, .mobile-item button { 
    height: 58px; width: 100%; margin: 6px 0; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; 
    color: #9ca3af; transition: all 0.3s ease; background: transparent; border: none; cursor: pointer;
}
.mobile-item.active a, .mobile-item.active button,
.mobile-item a:hover, .mobile-item button:hover { color: #e50914; background: rgba(229, 9, 20, 0.1); }
.mobile-item.active a i, .mobile-item.active button i { transform: scale(1.15); }
.mobile-item span { font-size: 0; opacity: 0; transition: all 0.3s ease; }
.mobile-item.active span, .mobile-item:hover span { font-size: 12px; opacity: 1; margin-top: 4px; }

/* --- MOBILE MORE DRAWER --- */
#mobile-more-drawer {
    position: fixed; bottom: 70px; left: 0; width: 100%;
    background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px 20px 0 0;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 9998; padding: 25px 20px 35px 20px; visibility: hidden;
}
#mobile-more-drawer.open { transform: translateY(0); visibility: visible; }
.drawer-link {
    display: flex; align-items: center; padding: 14px 18px; border-radius: 12px; gap: 12px;
    color: #e5e7eb; text-decoration: none; font-weight: 600; background: rgba(255, 255, 255, 0.03); 
    border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s;
}
.drawer-link:hover, .drawer-link:active { background: rgba(229, 9, 20, 0.15); border-color: rgba(229, 9, 20, 0.3); color: #fff; }

/* SVG Icons */
.nav-svg { width: 24px; height: 24px; display: block; fill: currentColor; transition: transform 0.2s ease; }

/* --- LAYOUT ADJUSTMENTS FOR GAMES.HTML --- */
@media (min-width: 768px) { 
    .sidebar { display: flex; } 
    .mobile-nav, #mobile-more-drawer { display: none; } 
    body { padding-left: 64px; }
    /* Shifts the existing top header so it doesn't hide behind the sidebar */
    header#navbar { padding-left: calc(4% + 64px); } 

    /* The sidebar overlays content (it's position:fixed) and expands to 240px
       wide on hover, which can cover the hero/category/row content that only
       clears its collapsed 64px width. Rather than permanently reserving the
       expanded width (which shifts content right all the time), only apply
       the extra clearance while the sidebar is actually expanded - toggled by
       JS via the .sidebar-expanded class on <body>. */
    .hero, .category-title, .row-container {
        transition: padding-left 0.3s ease, margin-left 0.3s ease;
    }
    body.sidebar-expanded .hero { padding-left: clamp(4%, 4% + 25vw, 240px); }
    body.sidebar-expanded .category-title { margin-left: clamp(4%, 4% + 25vw, 240px); margin-right: 4%; }
    body.sidebar-expanded .row-container { padding-left: clamp(4%, 4% + 25vw, 240px); }

    /* .hero is height:70vh and vertically centers its content; on short/narrow
       windows that box gets short enough that the centered title renders
       underneath the fixed header. Guarantee a minimum height and top
       clearance so that never happens. */
    .hero {
        min-height: 480px;
        padding-top: 90px;
    }
}
@media (max-width: 767px) { 
    body { padding-bottom: 70px; } 
}
    </style>

                description: "Unwind with a timeless game of solitaire, perfect for a quick mental break."
            },
            {
                id: 13,
                title: "Chess LK",
                category: "strategy",
                poster: "https://roskomsvoboda.org/uploads/images/block_chesscom.jpg",
                type: "iframe",
                url: "https://chithruka.github.io/Chithruka/Games/Chess/home.html",
                description: "Take on a locally hosted chess experience built for quick, casual matches."
            }
        ];

        // --- Render Functions ---

        let heroSlides = [];
        let heroIndex = 0;
        let heroTimer = null;
        let heroLayerToggle = false; // false -> layer A is next to receive the image, true -> layer B

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderHero() {
            const slideCount = Math.min(5, games.length);
            heroSlides = shuffleArray(games).slice(0, slideCount);
            if (heroSlides.length === 0) return;

            const dotsContainer = document.getElementById('heroDots');
            dotsContainer.innerHTML = heroSlides.map((g, i) =>
                `<button class="hero-dot" onclick="goToHeroSlide(${i})" aria-label="${g.title}"></button>`
            ).join('');

            showHeroSlide(0, true);
            startHeroTimer();
        }

        function showHeroSlide(index, isFirst) {
            const game = heroSlides[index];
            if (!game) return;
            heroIndex = index;

            const layerA = document.getElementById('heroBgA');
            const layerB = document.getElementById('heroBgB');
            const incoming = heroLayerToggle ? layerA : layerB;
            const outgoing = heroLayerToggle ? layerB : layerA;
            heroLayerToggle = !heroLayerToggle;

            incoming.style.backgroundImage = `url('${game.poster}')`;

            const applyFade = () => {
                incoming.classList.add('active');
                outgoing.classList.remove('active');
            };
            isFirst ? applyFade() : requestAnimationFrame(applyFade);

            const heroContent = document.getElementById('heroContent');
            const updateText = () => {
                document.getElementById('heroTitle').textContent = game.title;
                document.getElementById('heroDesc').textContent = game.description || '';
                document.getElementById('heroPlayBtn').onclick = () => playGame(game.id);
            };

            if (isFirst) {
                updateText();
            } else {
                heroContent.style.opacity = 0;
                setTimeout(() => {
                    updateText();
                    heroContent.style.opacity = 1;
                }, 250);
            }

            document.querySelectorAll('.hero-dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function goToHeroSlide(index) {
            showHeroSlide(index, false);
            startHeroTimer();
        }

        function startHeroTimer() {
            if (heroTimer) clearInterval(heroTimer);
            if (heroSlides.length > 1) {
                heroTimer = setInterval(() => {
                    showHeroSlide((heroIndex + 1) % heroSlides.length, false);
                }, 6000);
            }
        }

        function createGameCard(game) {
            return `
                <div class="game-card" onclick="playGame(${game.id})">
                    <div class="card-poster">
                        <img src="${game.poster}" alt="${game.title}" loading="lazy">
                        <div class="card-play-badge">
                            <svg viewBox="0 0 24 24"><path d="M4.5 3.5V20.5L20.5 12L4.5 3.5Z"></path></svg>
                        </div>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                        <div class="card-category">${game.category}</div>
                    </div>
                </div>
            `;
        }

        function renderRows() {
            const trendingContainer = document.getElementById('row-trending');
            const actionContainer = document.getElementById('row-action');
            const strategyContainer = document.getElementById('row-strategy');

            games.forEach(game => {
                const cardHtml = createGameCard(game);
                
                // Logic to distribute games (simplified for demo)
                if(game.category === 'trending') trendingContainer.innerHTML += cardHtml;
                if(game.category === 'action') actionContainer.innerHTML += cardHtml;
                if(game.category === 'strategy' || game.category === 'classic') strategyContainer.innerHTML += cardHtml;
                
                // Add everything to trending if the row is empty (fallback)
                if (game.category !== 'trending' && trendingContainer.children.length < 3) {
                     trendingContainer.innerHTML += cardHtml;
                }
            });
        }

        // --- Search Logic ---

        const searchInput = document.getElementById('searchInput');
        const mainView = document.getElementById('main-view');
        const searchResults = document.getElementById('search-results');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (query.length > 0) {
                mainView.classList.add('hidden');
                searchResults.classList.add('active');
                
                const filteredGames = games.filter(game => game.title.toLowerCase().includes(query));
                
                if (filteredGames.length > 0) {
                    searchResults.innerHTML = filteredGames.map(game => createGameCard(game)).join('');
                    // Fix styling for grid items to look good in search view
                    document.querySelectorAll('#search-results .game-card').forEach(el => {
                        el.style.width = '100%'; 
                    });
                } else {
                    searchResults.innerHTML = '<p style="text-align:center; width:100%; color: gray;">No games found matching "' + query + '"</p>';
                }
            } else {
                resetHome();
            }
        });

        function resetHome() {
            searchInput.value = '';
            mainView.classList.remove('hidden');
            searchResults.classList.remove('active');
        }

        // --- Game Player Logic ---

        function playGame(id) {
            const game = games.find(g => g.id === id);
            const modal = document.getElementById('gameModal');
            const body = document.getElementById('modalBody');
            
            modal.style.display = "flex";
            body.innerHTML = ''; // Clear previous

            if (game.type === 'iframe') {
                const attr = game.attributes ? game.attributes : '';
                body.innerHTML = `<iframe src="${game.url}" ${attr} width="100%" height="100%" frameborder="0"></iframe>`;
            } else if (game.type === 'script') {
                // For script embeds, we inject the iframe code derived in the data object
                body.innerHTML = game.code;
            }
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            const body = document.getElementById('modalBody');
            
            modal.style.display = "none";
            body.innerHTML = ''; // Stop the game audio/video
        }

        // Navbar Scroll Effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('navbar');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Sync main content clearance with the sidebar's hover-expanded state,
        // so content only shifts over while the sidebar is actually wide (see
        // the body.sidebar-expanded rules in the stylesheet), instead of
        // permanently.
        (function initSidebarExpandSync() {
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;
            sidebar.addEventListener('mouseenter', () => document.body.classList.add('sidebar-expanded'));
            sidebar.addEventListener('mouseleave', () => document.body.classList.remove('sidebar-expanded'));
        })();
// Initialize
renderHero();
renderRows();
initRowScrollers();

// --- Row Scroll Buttons (wired to pref-patch.css .scroll-btn styles) ---
function initRowScrollers() {
    document.querySelectorAll('.row-scroll-wrapper').forEach(wrapper => {
        const track = wrapper.querySelector('.row-container');
        const leftBtn = wrapper.querySelector('.scroll-btn.left-0');
        const rightBtn = wrapper.querySelector('.scroll-btn.right-0');
        if (!track || !leftBtn || !rightBtn) return;

        const updateState = () => {
            const maxScroll = track.scrollWidth - track.clientWidth;
            const atStart = track.scrollLeft <= 4;
            const atEnd = maxScroll <= 4 || track.scrollLeft >= maxScroll - 4;

            leftBtn.classList.toggle('hidden', atStart);
            rightBtn.classList.toggle('hidden', atEnd);
            track.classList.toggle('at-left', atStart);
            track.classList.toggle('at-right', atEnd);
        };

        leftBtn.addEventListener('click', () => {
            track.scrollBy({ left: -track.clientWidth * 0.8, behavior: 'smooth' });
        });
        rightBtn.addEventListener('click', () => {
            track.scrollBy({ left: track.clientWidth * 0.8, behavior: 'smooth' });
        });

        track.addEventListener('scroll', updateState, { passive: true });
        window.addEventListener('resize', updateState);

        updateState();
    });
}

// --- MOBILE MORE DRAWER LOGIC ---
function toggleMoreMenu() {
    const drawer = document.getElementById('mobile-more-drawer');
    const moreBtn = document.getElementById('more-menu-btn');
    drawer.classList.toggle('open');
    moreBtn.classList.toggle('active');
}

// Close drawer when clicking anywhere outside
document.addEventListener('click', function(e) {
    const drawer = document.getElementById('mobile-more-drawer');
    const moreBtn = document.getElementById('more-menu-btn');
    
    if (drawer && drawer.classList.contains('open')) {
        if (!drawer.contains(e.target) && !moreBtn.contains(e.target)) {
            drawer.classList.remove('open');
            moreBtn.classList.remove('active'); 
        }
    }
}); </script>
