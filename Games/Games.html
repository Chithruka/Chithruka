<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chithruka - Game Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        :root {
            --netflix-red: #E50914;
            --netflix-dark: #141414;
            --netflix-black: #000000;
            --text-white: #ffffff;
            --text-gray: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--netflix-dark);
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* --- Header / Navbar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 4%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            transition: background-color 0.3s;
        }

        header.scrolled {
            background-color: var(--netflix-dark);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--netflix-red);
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-decoration: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--text-gray);
            padding: 5px 10px;
            border-radius: 4px; /* Netflix uses square buttons mostly, but slight radius handles mobile better */
        }

        .search-container input {
            background: transparent;
            border: none;
            color: white;
            padding: 5px;
            font-size: 1rem;
            outline: none;
            width: 0;
            transition: width 0.4s ease;
            cursor: pointer;
        }

        .search-container:hover input, .search-container input:focus, .search-container input:not(:placeholder-shown) {
            width: 200px;
            cursor: text;
        }

        .search-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* --- Hero Section --- */
        .hero {
            height: 70vh;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 4%;
            background-image: linear-gradient(to right, rgba(20,20,20,1) 10%, rgba(20,20,20,0) 50%), url('https://playgama.com/cdn-cgi/imagedelivery/LN2S-4p3-GgZvEx3IPaKUA/c1f0c7c3-3611-4f93-49ae-3b779e216c00/enlarged');
            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 500px;
            z-index: 2;
        }

        .hero-title {
            width: 100%;
        }

        .hero-desc {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px black;
        }

        .btn-play {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 25px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .btn-play:hover {
            opacity: 0.8;
        }

        /* --- Game Rows --- */
        .category-title {
            margin: 30px 4% 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #e5e5e5;
        }

        .row-container {
            display: flex;
            overflow-x: auto;
            padding: 10px 4%;
            gap: 10px;
            scrollbar-width: none; /* Firefox */
        }
        
        .row-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .game-card {
            flex: 0 0 auto;
            width: 250px;
            aspect-ratio: 16/9;
            position: relative;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, z-index 0.3s;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .game-card:hover .card-info {
            opacity: 1;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* --- Search Results Area --- */
        #search-results {
            display: none;
            padding: 80px 4%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        #search-results.active {
            display: grid;
        }
        
        #main-view.hidden {
            display: none;
        }

        /* --- Game Modal / Player --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            height: 80%;
            max-width: 1000px;
            background: #000;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            z-index: 2001;
        }

        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Helper for the raw script games */
        .script-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white; /* Some script games need white bg */
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .game-card { width: 160px; }
            .search-container input:focus { width: 120px; }
            .logo { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

                <button class="btn-play" onclick="playGame(9)">

                <button class="btn-play" style="background:rgba(109, 109, 110, 0.7); color: white; margin-left: 10px;" onclick="showMoreInfo('cyberpunk-2077')">
    <i class="fa-solid fa-circle-info"></i> More Info
</button>
            </div>
        </div>

        <h3 class="category-title">Trending Now</h3>
        <div class="row-container" id="row-trending">
            </div>
<h3 class="category-title">Latest Free Web Games</h3>
<div class="row-container" id="row-f2p">
    </div>
        <h3 class="category-title">Action & Adventure</h3>

        // --- Render Functions ---

        function createGameCard(game) {
            return `
                <div class="game-card" onclick="playGame(${game.id})">
                    <img src="${game.poster}" alt="${game.title}">
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                    </div>
                </div>
            `;
        }

        function renderRows() {
            const trendingContainer = document.getElementById('row-trending');
            const actionContainer = document.getElementById('row-action');
            const strategyContainer = document.getElementById('row-strategy');

            games.forEach(game => {
                const cardHtml = createGameCard(game);
                
                // Logic to distribute games (simplified for demo)
                if(game.category === 'trending') trendingContainer.innerHTML += cardHtml;
                if(game.category === 'action') actionContainer.innerHTML += cardHtml;
                if(game.category === 'strategy' || game.category === 'classic') strategyContainer.innerHTML += cardHtml;
                
                // Add everything to trending if the row is empty (fallback)
                if (game.category !== 'trending' && trendingContainer.children.length < 3) {
                     trendingContainer.innerHTML += cardHtml;
                }
            });
        }

        // --- Search Logic ---

        const searchInput = document.getElementById('searchInput');
        const mainView = document.getElementById('main-view');
        const searchResults = document.getElementById('search-results');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            
            if (query.length > 0) {
                mainView.classList.add('hidden');
                searchResults.classList.add('active');
                
                const filteredGames = games.filter(game => game.title.toLowerCase().includes(query));
                
                if (filteredGames.length > 0) {
                    searchResults.innerHTML = filteredGames.map(game => createGameCard(game)).join('');
                    // Fix styling for grid items to look good in search view
                    document.querySelectorAll('#search-results .game-card').forEach(el => {
                        el.style.width = '100%'; 
                    });
                } else {
                    searchResults.innerHTML = '<p style="text-align:center; width:100%; color: gray;">No games found matching "' + query + '"</p>';
                }
            } else {
                resetHome();
            }
        });

        function resetHome() {
            searchInput.value = '';
            mainView.classList.remove('hidden');
            searchResults.classList.remove('active');
        }

        // --- Game Player Logic ---

        function playGame(id) {
            const game = games.find(g => g.id === id);
            const modal = document.getElementById('gameModal');
            const body = document.getElementById('modalBody');
            
            modal.style.display = "flex";
            body.innerHTML = ''; // Clear previous

            if (game.type === 'iframe') {
                const attr = game.attributes ? game.attributes : '';
                body.innerHTML = `<iframe src="${game.url}" ${attr} width="100%" height="100%" frameborder="0"></iframe>`;
            } else if (game.type === 'script') {
                // For script embeds, we inject the iframe code derived in the data object
                body.innerHTML = game.code;
            }
        }

        function closeGame() {
            const modal = document.getElementById('gameModal');
            const body = document.getElementById('modalBody');
            
            modal.style.display = "none";
            body.innerHTML = ''; // Stop the game audio/video
        }

        // Navbar Scroll Effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('navbar');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
// Initialize
renderRows();
fetchFreeBrowserGames();

// --- Free-To-Play API Logic ---
async function fetchFreeBrowserGames() {
    const f2pContainer = document.getElementById('row-f2p');
    f2pContainer.innerHTML = '<div style="color: gray; padding: 20px;">Loading live games...</div>';

    try {
        // We use a public CORS proxy here because the F2P API sometimes blocks direct browser requests
        const proxyUrl = 'https://corsproxy.io/?'; 
        const targetUrl = encodeURIComponent('https://www.freetogame.com/api/games?platform=browser&sort-by=popularity');
        
        const response = await fetch(proxyUrl + targetUrl);
        const data = await response.json();

        f2pContainer.innerHTML = ''; // Clear loading text

        // Grab the top 10 most popular free browser games
        data.slice(0, 10).forEach(game => {
            const cardHtml = `
                <div class="game-card" onclick="window.open('${game.game_url}', '_blank')">
                    <img src="${game.thumbnail}" alt="${game.title}">
                    <div class="card-info">
                        <div class="card-title">${game.title}</div>
                    </div>
                </div>
            `;
            f2pContainer.innerHTML += cardHtml;
        });
    } catch (error) {
        console.error('Error fetching F2P games:', error);
        f2pContainer.innerHTML = '<div style="color: #E50914; padding: 20px;">Failed to load games.</div>';
    }
}

// --- RAWG Redirect + Plyr Logic ---
async function showMoreInfo(gameId) {
    const modal = document.getElementById('gameModal');
    const body = document.getElementById('modalBody');
    
    modal.style.display = "flex";
    body.innerHTML = '<div style="color:white; padding: 20px;">Loading game data...</div>';

    try {
        // Use the Phalcode redirect URL instead of api.rawg.io
        // This service maps IDs to Steam data automatically
        const baseUrl = "https://rawg2steam.phalco.de/api/games";
        
        const detailsRes = await fetch(`${baseUrl}/${gameId}`);
        const game = await detailsRes.json();

        // Note: The redirect service provides Steam-based data.
        // It typically includes a "clip" or "trailers" field if available.
        let mediaSection = `<img src="${game.background_image}" style="width:100%; height:400px; object-fit:cover;" />`;

        if (game.clip && game.clip.clip) {
            mediaSection = `
                <video id="trailer-player" playsinline controls data-poster="${game.background_image}" style="width: 100%; height: 400px; object-fit: cover;">
                    <source src="${game.clip.clip}" type="video/mp4" />
                </video>
            `;
        }

        body.innerHTML = `
            <div style="width:100%; height:100%; display:flex; flex-direction:column; background:var(--netflix-dark); color:white; overflow-y:auto;">
                ${mediaSection}
                <div style="padding: 30px;">
                    <h2 style="font-family:'Bebas Neue', sans-serif; font-size:3.5rem; color:var(--netflix-red); margin-bottom: 10px; line-height: 1;">${game.name}</h2>
                    <div style="display: flex; gap: 15px; margin-bottom: 20px; font-weight: bold; color: #46d369;">
                        <span>${game.released ? game.released.split('-')[0] : 'N/A'}</span>
                        <span>⭐ ${game.rating || 'N/A'} / 5</span>
                    </div>
                    <p style="color:var(--text-gray); font-size: 1.1rem; line-height: 1.5;">${game.description_raw || 'No description available.'}</p>
                </div>
            </div>
        `;

        if (game.clip && game.clip.clip) {
            new Plyr('#trailer-player', { autoplay: true, muted: false });
        }

    } catch (error) {
        console.error('Error fetching data:', error);
        body.innerHTML = '<div style="color:white; padding: 20px;">Error loading game details. Using a redirect service...</div>';
    }
}  </script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
