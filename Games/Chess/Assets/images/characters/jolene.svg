<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg_jolene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e2e1e"/>
      <stop offset="100%" stop-color="#24150f"/>
    </linearGradient>
    <radialGradient id="glow_jolene" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d4935a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#24150f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="22" fill="url(#bg_jolene)"/>
  <rect width="200" height="200" rx="22" fill="url(#glow_jolene)"/>
  <!-- Chessboard subtle border accent -->
  <g opacity="0.12" fill="#f5d5a7">
    <rect x="14" y="14" width="12" height="12"/><rect x="38" y="14" width="12" height="12"/>
    <rect x="26" y="26" width="12" height="12"/><rect x="150" y="14" width="12" height="12"/>
    <rect x="174" y="14" width="12" height="12"/><rect x="162" y="26" width="12" height="12"/>
  </g>
  <!-- Hair puffs / 1950s braids -->
  <circle cx="52" cy="76" r="24" fill="#1b120e"/>
  <circle cx="148" cy="76" r="24" fill="#1b120e"/>
  <circle cx="100" cy="68" r="44" fill="#1b120e"/>
