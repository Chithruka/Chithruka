  <path d="M76 74 Q84 70 92 74" fill="none" stroke="#1b120e" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 74 Q116 70 124 74" fill="none" stroke="#1b120e" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="84" cy="84" rx="6" ry="4.5" fill="#fff"/>
  <ellipse cx="116" cy="84" rx="6" ry="4.5" fill="#fff"/>
  <circle cx="84.5" cy="84" r="3.4" fill="#23140d"/>
  <circle cx="116.5" cy="84" r="3.4" fill="#23140d"/>
  <circle cx="85.8" cy="82.7" r="1.1" fill="#fff"/>
  <circle cx="117.8" cy="82.7" r="1.1" fill="#fff"/>
  <!-- Nose -->
  <path d="M100 84 L96 98 Q100 101 104 98" fill="none" stroke="#5b321d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Warm confident smile -->
  <path d="M86 108 Q100 119 114 108 Z" fill="#f7f2ea"/>
  <path d="M85 108 Q100 121 115 108" fill="none" stroke="#472213" stroke-width="2.5" stroke-linecap="round"/>
