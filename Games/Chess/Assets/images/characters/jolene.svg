  <ellipse cx="64" cy="88" rx="6" ry="9" fill="#74432a"/>
  <ellipse cx="136" cy="88" rx="6" ry="9" fill="#74432a"/>
  <!-- Hairline -->
  <path d="M64 76 C68 42, 132 42, 136 76 C125 60, 110 56, 100 58 C90 56, 75 60, 64 76 Z" fill="#1b120e"/>
